name: Promemoria ascolti MAPS

on:
  schedule:
    - cron: "0 9 * * *"   # ogni giorno alle 09:00 UTC (11:00 in Italia)
  workflow_dispatch: {}

jobs:
  promemoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Invia promemoria ascolti MAPS
        env:
          STREAMLIT_SECRETS: ${{ secrets.STREAMLIT_SECRETS }}
          EMAIL_STUDIO: info@pnev.it
        run: python scripts/promemoria_ascolti_maps.py
