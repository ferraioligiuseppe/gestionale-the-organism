<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Attività in classe</title>
<style>
  :root{ --ink:#1c2733; --muted:#5c6b7a; --line:#d9e0e7; --bg:#f4f6f8; --card:#fff; --accent:#1d5b8f; --ok:#1d6b44; --warn:#9a5b00; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); line-height:1.45; }
  main{ max-width:900px; margin:0 auto; padding:24px 18px 40px; }
  h1{ font-size:26px; margin:0 0 4px; }
  h2{ font-size:19px; margin:26px 0 10px; }
  .lead{ color:var(--muted); margin:0 0 18px; }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  label{ display:block; font-weight:600; margin-bottom:6px; }
  input{ font:inherit; font-size:24px; letter-spacing:.18em; text-transform:uppercase; width:100%; max-width:280px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  button{ font:inherit; font-size:16px; min-height:46px; padding:0 18px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.sec{ background:#fff; color:var(--accent); }
  button:focus-visible, a:focus-visible, input:focus{ outline:3px solid rgba(29,91,143,.35); outline-offset:2px; }
  .riga{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .msg{ margin-top:10px; min-height:1.4em; font-weight:600; }
  .msg.err{ color:#a12a2a; } .msg.ok{ color:var(--ok); }
  .alunni{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .alunni button{ background:#fff; color:var(--ink); border-color:var(--line); font-size:20px; min-height:64px; }
  .alunni button[aria-pressed="true"]{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .giochi{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  a.gioco{ display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-decoration:none; color:inherit; min-height:110px; }
  a.gioco h3{ margin:0 0 4px; color:var(--accent); font-size:19px; }
  a.gioco p{ margin:0; font-size:15px; }
  .chi{ font-size:22px; font-weight:700; }
  .barra{ margin-top:26px; font-size:14px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; }
  .stato.coda{ color:var(--warn); font-weight:600; } .stato.ok{ color:var(--ok); font-weight:600; }
  .gruppo{ margin:22px 0 8px; font-size:16px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .ok-dati{ display:inline-block; font-size:12px; font-weight:700; color:var(--ok); background:#e6f2ea; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle; }
  .nota-dati{ color:var(--muted); font-size:14px; margin:0 0 6px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Attività in classe</h1>
  <p class="lead" id="sotto">Collega questo tablet alla classe con il codice ricevuto.</p>

  <!-- 1. Collegamento del tablet alla classe -->
  <section id="v-collega" class="box">
    <form id="f-classe" class="riga" autocomplete="off">
      <div>
        <label for="codice">Codice classe</label>
        <input id="codice" maxlength="12" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ES. K7Q3MP">
      </div>
      <button type="submit" style="align-self:flex-end">Collega</button>
    </form>
    <div id="msg-classe" class="msg" role="status"></div>
  </section>

  <!-- 2. Scelta dell'alunno e del gioco -->
  <section id="v-classe" hidden>
    <h2>Chi gioca adesso? Tocca il tuo codice</h2>
    <div id="alunni" class="alunni"></div>

    <div id="v-giochi" hidden>
      <h2>Ora gioca <span class="chi" id="chi"></span></h2>
      <p class="nota-dati">I giochi con il segno <span class="ok-dati">✓ dati</span> inviano i risultati alla ricerca. Gli altri si possono usare liberamente in classe.</p>
      <div id="elenco-giochi"></div>
      <div class="riga" style="margin-top:16px">
        <button type="button" class="sec" id="fine">Fine turno: passa al compagno</button>
      </div>
    </div>
  </section>

  <div class="barra">
    <span id="stato" class="stato" role="status"></span>
    <span class="riga">
      <button type="button" class="sec" id="invia-ora" hidden>Invia ora</button>
      <button type="button" class="sec" id="cambia" hidden>Cambia classe</button>
    </span>
  </div>
</main>
