<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNEV Sport Vision · Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#1D6B44; --lime:#7ee0aa; --teal:#3fb0c8; --amber:#ffd27a; --red:#e0685c; --ink:#0d1512;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--ink); font-family:'Nunito',system-ui,sans-serif; overflow:hidden;}
  .stage{position:relative; width:100%; aspect-ratio:16/9; max-height:100dvh; margin:0 auto; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, #12312a 0%, #0d1512 60%);}
  .stage::before{content:""; position:absolute; inset:0; opacity:.10; z-index:0;
    background-image:linear-gradient(#7ee0aa 1px,transparent 1px),linear-gradient(90deg,#7ee0aa 1px,transparent 1px);
    background-size:48px 48px; mask:radial-gradient(circle at 50% 45%,#000 40%,transparent 75%);}
  .brandtop{position:absolute; top:5%; left:0; right:0; text-align:center; z-index:5;
    font-family:'Fredoka',sans-serif; font-weight:500; letter-spacing:3px; font-size:clamp(10px,1.5vw,15px);
    color:#8fe6b4; text-transform:uppercase;}
  .scene{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; z-index:2; text-align:center; padding:4%;}
  .scene.active{opacity:1;}
  .label{font-family:'Fredoka',sans-serif; font-weight:600; color:#eafff4; font-size:clamp(20px,4.2vw,44px); opacity:0;}
  .sublabel{font-family:'Nunito',sans-serif; color:#9fcdb8; font-size:clamp(12px,2vw,20px); margin-top:6px; opacity:0;}
  .metric{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(30px,8vw,90px); color:var(--lime); opacity:0; line-height:1;}
  .scene.active .label{animation:rise .6s .15s both;}
  .scene.active .sublabel{animation:rise .6s .35s both;}
  .scene.active .metric{animation:pop .55s .5s both;}
  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
  @keyframes pop{0%{opacity:0; transform:scale(.5);} 60%{transform:scale(1.12);} 100%{opacity:1; transform:scale(1);}}

  /* INTRO */
  #s-intro .big{font-family:'Fredoka',sans-serif; font-weight:700; color:#fff; line-height:.95;
    font-size:clamp(34px,9vw,100px); opacity:0;}
  #s-intro .big .accent{color:var(--lime);}
  #s-intro.active .big{animation:rise .7s .1s both;}
  #s-intro .tag{color:#bfe6d3; font-size:clamp(13px,2.4vw,24px); margin-top:14px; opacity:0;}
  #s-intro.active .tag{animation:rise .7s .5s both;}

  /* REAZIONE */
  .rbox{width:min(42%,220px); aspect-ratio:1.4; border-radius:20px; display:flex; align-items:center; justify-content:center;
    margin-bottom:20px; background:#5c2b25; position:relative;}
  .scene.active .rbox{animation:react 2.6s .2s both;}
  @keyframes react{0%,35%{background:#5c2b25;} 45%,100%{background:var(--green);}}
  .ripple{position:absolute; width:40px; height:40px; border-radius:50%; border:4px solid #eafff4; opacity:0;}
  .scene.active .ripple{animation:rip 1s 1.15s both;}
  @keyframes rip{0%{opacity:.9; transform:scale(.3);} 100%{opacity:0; transform:scale(3.2);}}

  /* VISIONE */
  .field{position:relative; width:min(60%,340px); aspect-ratio:1.5; margin-bottom:18px;}
  .plus{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--amber);
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(24px,5vw,44px);}
  .pdot{position:absolute; width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#8fe0f2,var(--teal)); transform:translate(-50%,-50%) scale(0); }
  .scene.active .pdot{animation:pdot 1s both;}
  .pdot.d1{left:16%; top:26%;} .pdot.d2{left:84%; top:30%;} .pdot.d3{left:22%; top:78%;} .pdot.d4{left:80%; top:76%;} .pdot.d5{left:50%; top:14%;}
  .scene.active .d1{animation-delay:.5s;} .scene.active .d2{animation-delay:.85s;} .scene.active .d3{animation-delay:1.2s;} .scene.active .d4{animation-delay:1.55s;} .scene.active .d5{animation-delay:1.9s;}
  @keyframes pdot{0%{transform:translate(-50%,-50%) scale(0);} 30%{transform:translate(-50%,-50%) scale(1.15);} 70%{transform:translate(-50%,-50%) scale(1);} 100%{transform:translate(-50%,-50%) scale(0); opacity:0;}}

  /* TIMING */
  .track{position:relative; width:min(70%,420px); height:8px; background:#22403a; border-radius:8px; margin-bottom:22px;}
  .goalline{position:absolute; right:8%; top:-22px; height:52px; width:5px; background:var(--amber); border-radius:4px;}
  .mover{position:absolute; left:0; top:50%; width:30px; height:30px; border-radius:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 40% 35%,var(--lime),var(--green));}
  .scene.active .mover{animation:travel 2s .3s both;}
  @keyframes travel{0%{left:2%;} 100%{left:92%;}}

  /* AGILITA */
  .arrows{display:flex; gap:min(10vw,90px); align-items:center; margin-bottom:20px;}
  .arw{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(40px,10vw,110px); color:#2a4a42;}
  .scene.active .arw.l{animation:blink 2.4s .2s both;}
  .scene.active .arw.r{animation:blink2 2.4s .2s both;}
  @keyframes blink{0%,20%{color:#2a4a42;} 25%,45%{color:var(--teal);} 50%,100%{color:#2a4a42;}}
  @keyframes blink2{0%,55%{color:#2a4a42;} 60%,80%{color:var(--lime);} 85%,100%{color:#2a4a42;}}

  /* OUTRO */
  #s-outro .otitle{font-family:'Fredoka',sans-serif; font-weight:700; color:#fff; font-size:clamp(28px,7vw,80px); opacity:0;}
  #s-outro .otitle .accent{color:var(--lime);}
  #s-outro.active .otitle{animation:pop .6s .1s both;}
  #s-outro .cta{margin-top:18px; display:inline-block; font-family:'Fredoka',sans-serif; font-weight:600;
    color:#0d1512; background:var(--lime); padding:12px 30px; border-radius:999px; font-size:clamp(14px,2.4vw,22px); opacity:0;}
  #s-outro.active .cta{animation:rise .6s .55s both;}

  .coach{height:78%; width:auto; align-self:flex-end; filter:drop-shadow(0 10px 22px rgba(0,0,0,.55)); opacity:0; z-index:3;}
  .scene.active .coach{animation:coachIn .8s .2s both;}
  @keyframes coachIn{from{opacity:0; transform:translateX(40px) translateY(10px);} to{opacity:1; transform:none;}}
  #s-intro, #s-outro{flex-direction:row; gap:min(4vw,48px); align-items:center; justify-content:center;}
  #s-intro .txtcol, #s-outro .txtcol{text-align:left;}
  @media (max-width:560px){ .coach{height:64%;} #s-intro,#s-outro{gap:12px;} }
  .prog{position:absolute; bottom:0; left:0; height:4px; background:var(--lime); width:0; z-index:6;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01s !important;} }
</style>
</head>
