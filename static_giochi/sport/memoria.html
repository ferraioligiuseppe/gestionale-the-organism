<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PNEV &#183; Memoria e sequenze</title>
<style>
  :root{
    --carta:#E9EDEE; --carta-alt:#F6F8F8; --inchiostro:#101A20; --grigio:#5D7078;
    --riga:#BFCCD1; --rosso:#C8102E; --verde:#00843D;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--carta);color:var(--inchiostro);font-family:var(--sans);font-size:16px;
       line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:4rem}
  header{padding:1.4rem 1.25rem 1rem;border-bottom:1px solid var(--riga);background:var(--carta-alt);position:relative}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
    background:linear-gradient(90deg,var(--rosso) 0 50%,var(--verde) 50% 100%)}
  h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
  .sub{margin:.25rem 0 0;color:var(--grigio);font-size:.85rem;font-family:var(--mono)}
  section{border-bottom:1px solid var(--riga);padding:1.4rem 1.25rem}
  .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--grigio);margin:0 0 .9rem}
  h2{margin:0 0 .35rem;font-size:1.05rem}
  p.help{margin:0 0 1rem;color:var(--grigio);font-size:.88rem;max-width:60ch}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.1rem}
  label.f{display:block;margin-bottom:.9rem}
  label.f > span{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;
    text-transform:uppercase;color:var(--grigio);margin-bottom:.35rem}
  label.f > span em{font-style:normal;color:var(--inchiostro);float:right;font-weight:600}
  select{width:100%;font-family:var(--mono);font-size:.95rem;padding:.55rem .6rem;
    border:1px solid var(--riga);border-radius:3px;background:var(--carta-alt);color:var(--inchiostro)}
  input[type=range]{width:100%;accent-color:var(--rosso);height:2.2rem}
  button{font-family:var(--sans);font-size:.95rem;font-weight:600;padding:.75rem 1.2rem;
    border:1px solid var(--inchiostro);border-radius:3px;background:var(--inchiostro);
    color:var(--carta-alt);cursor:pointer}
  button.ghost{background:transparent;color:var(--inchiostro)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1px;
    background:var(--riga);border:1px solid var(--riga);border-radius:4px;overflow:hidden;margin-top:1.2rem}
  .readout div{background:var(--carta-alt);padding:.7rem .8rem}
  .readout dt{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--grigio);margin:0 0 .2rem}
  .readout dd{margin:0;font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
  .readout dd small{font-size:.7rem;color:var(--grigio);font-weight:400}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.85rem;margin-top:.8rem}
  th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--riga)}
  th{font-size:.65rem;letter-spacing:.13em;text-transform:uppercase;color:var(--grigio)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .barra{height:10px;background:var(--riga);border-radius:5px;overflow:hidden;min-width:80px}
  .barra i{display:block;height:100%;background:var(--verde)}
  .muted{color:var(--grigio);font-size:.85rem;font-family:var(--mono)}
  a.link{color:var(--inchiostro)}

  #stage{position:fixed;inset:0;display:none;z-index:50;overflow:hidden;touch-action:none;background:#0B0F12}
  #stage.on{display:block}
  #griglia{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
           display:grid;gap:2.2%}
  .cella{background:#1B242A;border:2px solid #2B363D;border-radius:12px;display:grid;place-items:center;
         font:800 clamp(1.2rem,4vw,2.4rem) var(--mono);color:#8A9AA1;cursor:pointer;
         transition:background .06s linear}
  .cella.acceso{background:#12B36A;border-color:#12B36A;color:#0B0F12}
  .cella.acceso.anaglyph{background:#0B0F12;border-color:#2B363D;position:relative;}
  .cella.acceso.anaglyph::before,.cella.acceso.anaglyph::after{content:'';position:absolute;inset:8%;border-radius:8px;mix-blend-mode:screen;}
  .cella.acceso.anaglyph::before{background:#E8000D; transform:translateX(-6px);}
  .cella.acceso.anaglyph::after{background:#00AEEF; transform:translateX(6px);}
  .cella.acceso.anaglyph.green-mode::after{background:#00A651;}
  .cella.errore{background:#C8102E;border-color:#C8102E;color:#fff}
  .cella.premuto{background:#2F3E46}
  #msg{position:absolute;left:0;right:0;top:7%;text-align:center;color:#8A9AA1;
       font:700 clamp(1rem,3vw,1.7rem) var(--sans);pointer-events:none}
  #hud{position:absolute;top:.6rem;left:.9rem;right:.9rem;display:flex;justify-content:space-between;
       font-family:var(--mono);font-size:.78rem;color:#8A9AA1;pointer-events:none}
  #esc{position:absolute;top:.4rem;right:.6rem;font-size:.8rem;padding:.5rem .8rem;
       background:transparent;color:#8A9AA1;border-color:#3A464C;z-index:3}
</style>
</head>
<body>

<header>
  <h1>Memoria e sequenze</h1>
  <p class="sub">PNEV &#183; visiva, uditiva, audio-visiva</p>
</header>

<section>
  <p class="eyebrow">Impostazioni</p>
  <h2>Fin dove arriva la sequenza</h2>
  <p class="help">La sequenza si allunga quando viene ripetuta bene e si accorcia quando sfugge, finch&#233; non si stabilizza: quello &#232; lo span di quel paziente.
    <a class="link" href="/wp-content/uploads/giochi/setup/">Apri la console di calibrazione</a></p>

  <div class="grid">
    <div>
      <label class="f"><span>Canale</span>
        <select id="canale">
          <option value="visivo">Visivo: si illuminano le caselle</option>
          <option value="uditivo">Uditivo: la voce dice i numeri</option>
          <option value="misto">Audio-visivo: insieme</option>
          <option value="conflitto">In conflitto: voce e luce non coincidono</option>
        </select></label>
      <p class="muted" id="descCanale"></p>
    </div>
    <div>
      <label class="f"><span>Ordine di ripetizione</span>
        <select id="ordine">
          <option value="avanti">Avanti, come mostrata</option>
          <option value="indietro">Indietro, dall&#8217;ultima alla prima</option>
        </select></label>
      <label class="f"><span>Lunghezza di partenza <em id="lStart">3</em></span>
        <input type="range" id="start" min="2" max="7" step="1" value="3"></label>
      <label class="f"><span>Numero di prove <em id="lProve">14</em></span>
        <input type="range" id="prove" min="6" max="40" step="2" value="14"></label>
    </div>
    <div>
      <label class="f"><span>Caselle</span>
        <select id="celle">
          <option value="9">Nove (3 per 3)</option>
          <option value="4">Quattro (2 per 2)</option>
          <option value="16">Sedici (4 per 4)</option>
        </select></label>
      <label class="f"><span>Ritmo di presentazione <em id="lRitmo">700 ms</em></span>
        <input type="range" id="ritmo" min="250" max="1500" step="50" value="700"></label>
      <label class="f"><span>Numeri nelle caselle</span>
        <select id="numeri">
          <option value="1">S&#236;: aiutano a nominare</option>
          <option value="0">No: solo posizione</option>
        </select></label>
    </div>
    <div>
      <label class="f"><span>Casella anaglifica</span>
        <select id="anaglifico">
          <option value="no">No</option>
          <option value="si">S&#236;, richiede occhialini</option>
        </select></label>
      <label class="f"><span>Colore occhialini</span>
        <select id="anaglificoColore">
          <option value="ciano">Rosso / Ciano</option>
          <option value="verde">Rosso / Verde</option>
        </select></label>
    </div>
  </div>

  <div class="row" style="margin-top:.4rem">
    <button id="run">Avvia</button>
    <button class="ghost" id="csv" disabled>Esporta CSV</button>
    <button class="ghost" id="json" disabled>Esporta JSON</button>
  </div>
  <div id="res"></div>
</section>

<div id="stage">
  <div id="griglia"></div>
  <div id="msg"></div>
  <div id="hud"><span id="hudL"></span><span id="hudR"></span></div>
  <button id="esc" class="ghost">Chiudi</button>
</div>
