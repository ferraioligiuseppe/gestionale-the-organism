<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giochiamo imparando — Calcolo | PNEV</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#e6eef8;--ink:#232659;--indaco:#2e3192;--soft:#5b6290;--line:#d3deee;--ok:#12a07a;--err:#e5484d;--sun:#ffb400;
  --font:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--desk);font-size:18px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--indaco);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:14px clamp(10px,2vw,24px);display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:26px;margin-right:auto}
.pill{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--line);background:#fff;font-weight:700}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 0 var(--line)}
.card h2{margin:0 0 8px;font-size:22px}
.card p{margin:0 0 12px;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.row b{min-width:140px}
.seg button{min-height:50px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--indaco);border-color:var(--indaco);color:#fff}
.btn{min-height:60px;padding:0 28px;border-radius:30px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:19px}
.btn.primary{background:var(--indaco);border-color:var(--indaco);color:#fff}
.board{position:relative;background:#fff;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 0 var(--line)}
.board canvas{display:block;width:100%;height:100%;touch-action:none}
.boardbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:17px;color:var(--soft)}
.status strong{color:var(--ink);font-size:20px}
.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.msg.on{opacity:.92}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0 16px}
.m{border:2px solid var(--line);border-radius:14px;padding:12px}
.m span{display:block;font-size:14px;color:var(--soft)}
.m strong{font-size:26px}
table{border-collapse:collapse;width:100%;font-size:15px;margin-bottom:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--soft);font-weight:400}
.note{font-size:14px;color:var(--soft)}

.es{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:16px;border:2px solid var(--line);background:#fff;min-height:150px}
.es:hover:not([disabled]){border-color:var(--indaco)}.es[disabled]{opacity:.5;cursor:default}
.es .area{font-size:14px;color:var(--soft);font-weight:700}.es strong{font-size:21px}.es .d{font-size:15px;color:var(--soft);line-height:1.4}
.elenco{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grande{font-size:clamp(44px,8vw,96px);font-weight:700;text-align:center;padding:24px 10px;min-height:170px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:18px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.scelte{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn.num{font-size:30px;min-width:76px;min-height:72px}
.disp{text-align:center;font-size:44px;font-weight:700;letter-spacing:.12em;min-height:60px;margin:10px 0}
.tast{display:grid;grid-template-columns:repeat(3,90px);gap:10px;justify-content:center}
.campo{background:#fff;border-radius:18px;height:300px;display:flex;align-items:center;justify-content:center}
.campo .dots{width:min(92%,520px);height:auto}.fix{font-size:60px;color:var(--soft)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lato{background:#fff;border:2px solid var(--line);border-radius:18px;min-height:260px;display:flex;align-items:center;justify-content:center;padding:10px}
.lato:hover{border-color:var(--indaco)}.lato .dots{width:90%}.cifra{font-weight:700;color:var(--ink)}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:18px;padding:24px}
.cella{min-width:84px;padding:14px 10px;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:32px;font-weight:700}
.cella.buco{border-style:dashed;border-color:var(--indaco);color:var(--indaco)}
.prob{background:#fff;border-radius:18px;padding:22px;text-align:center}
.fig{font-size:clamp(28px,4vw,40px);line-height:1.4;word-break:break-word}.fig s{opacity:.35}
.ptxt{font-size:clamp(20px,2.6vw,26px);line-height:1.45;margin:14px auto 10px;max-width:34em}
.stelle{font-size:40px;color:var(--sun);letter-spacing:4px}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Calcolo</h1><a class="pill" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none">← Giochiamo imparando</a></header>
  <section id="setup">
    <div class="card">
      <div class="row"><b>Modalità</b><span class="seg" data-k="modo"><button data-v="valutazione">Valutazione</button><button data-v="allenamento">Allenamento</button></span></div>
      <div class="row"><b>Età</b><span class="seg" data-k="fascia"><button data-v="4-6">4–6</button><button data-v="6-8">6–8</button><button data-v="8-11">8–11</button><button data-v="11-14">11–14</button><button data-v="adulti">Adulti</button></span></div>
      <p class="note" id="nota-modo"></p>
    </div>
    <div class="elenco" id="elenco"></div>
    <p class="note">Misure grezze (risposte giuste, tempi, strategie): non sono una diagnosi e non hanno ancora norme per età. Si leggono insieme alla valutazione clinica e ai test standardizzati.</p>
  </section>
  <section id="play" hidden>
    <div class="status"><button class="pill" id="esci">← Esercizi</button><strong id="titolo"></strong><span id="stato"></span></div>
    <p class="note" id="consegna"></p>
    <div class="board" style="background:none;box-shadow:none;overflow:visible;touch-action:manipulation"><div id="area"></div><div class="msg" id="msg"></div></div>
    <div class="ctrl" id="ctrl"></div>
  </section>
  <section class="card" id="results" hidden>
    <h2 id="r-titolo"></h2><div class="stelle" id="stelle"></div>
    <div class="metrics" id="metrics"></div><div id="dettaglio"></div>
    <div class="ctrl"><button class="btn primary" id="send">Invia allo studio</button><button class="btn" id="again">Rifai</button><button class="btn" id="menu">Altri esercizi</button></div>
  </section>
</div>
