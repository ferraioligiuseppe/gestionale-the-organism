services:
  - type: web
    name: gestionale-the-organism
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_MODE
        value: prod
      - key: PYTHON_VERSION
        value: 3.11.9
