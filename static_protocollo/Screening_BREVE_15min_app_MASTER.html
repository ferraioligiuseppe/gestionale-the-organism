<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screening breve 15 minuti — Studio The Organism</title>
<style>
:root{--navy:#123A6B;--green:#1D6B44;--line:#c9d2dd;--bg:#eef1f5;--alert:#b3261e;--warn:#b4601a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#16202c;background:var(--bg)}
header{background:#fff;border-bottom:3px solid var(--green);padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
header img{height:32px}header .t{font-weight:600;color:var(--navy)}header .sp{flex:1}
nav{display:flex;gap:3px;flex-wrap:wrap;background:var(--navy);padding:6px 12px;position:sticky;top:53px;z-index:29}
nav button{background:transparent;border:0;color:#cfdcee;padding:6px 10px;border-radius:5px;font-size:12.5px;cursor:pointer}
nav button.on{background:#fff;color:var(--navy);font-weight:600}
nav button i{font-style:normal;opacity:.65;font-size:11px;margin-left:4px}
main{max-width:940px;margin:14px auto;padding:0 12px 96px}
.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:11px}
.card h2{margin:0 0 3px;font-size:15.5px;color:var(--navy)}
.card h3{margin:13px 0 5px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.pnevbox{background:#f2f6fa;border-left:4px solid var(--green);border-radius:0 5px 5px 0;padding:10px 13px;font-size:12.5px;line-height:1.5;margin-bottom:11px}
.pnevbox b{color:var(--navy)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;margin-top:8px}
.fld label{display:block;font-size:11.5px;color:#54606d;margin-bottom:2px}
.fld input,.fld select{width:100%;border:1px solid #dde3ea;border-radius:5px;padding:6px 7px;background:#fbfcfd}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--green);background:#f3f9f5}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;font-size:12.5px}
td{border-bottom:1px solid #e6eaef;padding:5px 8px}
td.c,th.c{text-align:center}
.sc{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.cons{background:#eef4ef;border-left:3px solid var(--green);padding:7px 10px;font-size:13px;margin:8px 0;border-radius:0 4px 4px 0}
.cons b{color:var(--green)}
.tot{display:inline-block;background:#eef2f7;border-radius:5px;padding:4px 10px;font-size:13px;margin:7px 7px 0 0}
.tot b{color:var(--navy)}
.flag{border-radius:6px;padding:9px 12px;margin-top:11px;font-size:14px;font-weight:600}
.flag.no{background:#e9f3ec;color:var(--green)}.flag.si{background:#fbe9e7;color:var(--alert)}
.flag.nd{background:#f1f3f6;color:#64707d}
.crit{font-size:12px;color:#64707d;margin-top:5px}
.tbser{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 9px}
.tbser button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--navy)}
.tbser button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.tbt{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:7px 10px;margin-bottom:6px;background:#fff}
.tbt.ok{border-left-color:var(--green)}.tbt.ko{border-left-color:var(--alert)}
.tbt .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tbt .n{font-weight:600;color:var(--navy);min-width:28px}
.tbt .ab{flex:1;font-size:14px}.tbt .dd{font-size:11.5px;color:#5a6673;background:#eef2f7;border-radius:9px;padding:1px 7px}
.tbo{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tbo span{border:1px solid var(--line);background:#fbfcfd;border-radius:14px;padding:6px 12px;font-size:13px;cursor:pointer}
.tbo span.sel{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.tbo span.sel.bad{background:var(--alert);border-color:var(--alert)}
.tbpri{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.tbpri input{border:1px solid #dde3ea;border-radius:5px;padding:5px 7px;font-size:13px;width:125px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;z-index:31}
button.act{background:var(--navy);color:#fff;border:0;border-radius:5px;padding:8px 13px;font-size:13.5px;cursor:pointer}
button.act.g{background:var(--green)}button.act.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.bar .sp{flex:1}
.sem{display:inline-block;padding:5px 14px;border-radius:15px;font-size:15px;font-weight:600}
.sem.v{background:#e9f3ec;color:var(--green)}.sem.g{background:#fdf1e3;color:var(--warn)}
.sem.r{background:#fbe9e7;color:var(--alert)}.sem.n{background:#f1f3f6;color:#64707d}
.mut{color:#64707d;font-size:12.5px}
.sig{text-align:center;font-size:11.5px;color:#7a8594;margin-top:16px}.sig b{color:var(--green)}
@media print{header,nav,.bar,.noprint{display:none!important}body{background:#fff}
 .card{border:0;border-bottom:1px solid #ccc;border-radius:0;page-break-inside:avoid}
 .tbo span{border:1px solid #999}.tbo span.sel{background:#123a6b;color:#fff}}
</style></head><body>

": "num"}, {"k": "e_par", "l": "Errori parole", "t": "num"}, {"k": "t_np", "l": "Lettura non parole — tempo (s)", "t": "num"}, {"k": "e_np", "l": "Errori non parole", "t": "num"}]}, {"h": "Dettato di otto parole", "cons": "Adesso ti detto otto parole, una alla volta. Scrivile come pensi che si scrivano.", "max": 1, "lab": ["no", "sì"], "k": "dt", "tot": "Dettato", "items": ["chiave", "ghiaccio", "famiglia", "pesce", "bicchiere", "quaderno", "perché", "acqua"]}, {"f": [{"k": "lele", "l": "«le le le» 30\" — grafemi", "t": "num"}, {"k": "lele2", "l": "Senza staccare — grafemi", "t": "num"}, {"k": "stacchi", "l": "Stacchi involontari", "t": "num"}, {"k": "presa", "l": "Presa", "t": "sel", "o": ["", "tripode dinamico", "tripode statico", "quadripode", "a pugno"]}, {"k": "copia", "l": "Copia di figure (/6)", "t": "num"}, {"k": "fatti", "l": "Fatti aritmetici entro 3\" (/8)", "t": "num"}, {"k": "enum", "l": "Enumerazione 1→20", "t": "sel", "o": ["", "ok", "incerta"]}, {"k": "enumi", "l": "Indietro da 20", "t": "sel", "o": ["", "ok", "incerta"]}]}]}, {"id": "nm", "t": "6 · Neuromotorio e posturale", "m": "2'", "s": [{"h": "Prove (0 nessuna anomalia — 4 non esegue)", "max": 4, "lab": ["0", "1", "2", "3", "4"], "k": "nm", "tot": "Somma", "items": ["Romberg — occhi aperti", "Romberg — occhi chiusi", "Stazione su un piede — dx", "Stazione su un piede — sx", "Movimenti crociati (30\")", "Movimenti omolaterali (30\")", "Pronosupinazione alternata", "ATNR", "STNR"]}, {"f": [{"k": "allin", "l": "Allineamento", "t": "sel", "o": ["", "nei limiti", "asimmetria lieve", "asimmetria evidente"]}, {"k": "appog", "l": "Appoggio plantare", "t": "sel", "o": ["", "neutro", "pronato", "supinato", "cavo", "piatto"]}, {"k": "cerv", "l": "Rotazione cervicale", "t": "sel", "o": ["", "simmetrica", "ridotta a dx", "ridotta a sx"]}, {"k": "fuk", "l": "Fukuda — gradi", "t": "num"}, {"k": "fukv", "l": "Fukuda — verso", "t": "sel", "o": ["", "dx", "sx"]}]}]}, {"id": "mio", "t": "7 · Miofunzionale e fluenza (osservati)", "m": "1'", "s": [{"f": [{"k": "resp", "l": "Respirazione", "t": "sel", "o": ["", "nasale", "orale", "mista"]}, {"k": "labbra", "l": "Labbra a riposo", "t": "sel", "o": ["", "competenti", "incompetenti", "lingua interposta"]}, {"k": "degl", "l": "Deglutizione", "t": "sel", "o": ["", "fisiologica", "atipica"]}, {"k": "palato", "l": "Palato", "t": "sel", "o": ["", "normale", "ogivale"]}, {"k": "abit", "l": "Abitudini viziate", "t": "sel", "o": ["", "nessuna", "ciuccio", "dito", "onicofagia"]}, {"k": "atm", "l": "ATM", "t": "sel", "o": ["", "nessun rilievo", "clic"]}, {"k": "flu", "l": "Fluenza nel parlato", "t": "sel", "o": ["", "fluente", "disfluenze comuni", "disfluenze tipiche della balbuzie"]}, {"k": "vel", "l": "Velocità di eloquio", "t": "sel", "o": ["", "adeguata", "elevata"]}]}]}], PNEVBOX=" <b>Chi siamo.</b> Associazione The Organism — équipe multidisciplinare (psicologia e neuropsicologia, optometria comportamentale, logopedia, osteopatia, terapia miofunzionale), sedi di Pagani (SA) e Piano di Sorrento (NA). Lavoriamo secondo il metodo <b>PNEV</b>, Psico-Neuro-Evolutivo.<br> <b>Come guardiamo un bambino.</b> Leggere, scrivere e stare attenti non sono funzioni che poggiano su sé stesse: si costruiscono su equilibrio, ascolto, vista, movimento degli occhi e respirazione. Quando uno di questi fondamenti è instabile, la difficoltà non compare lì, ma più in alto, dove il bambino viene valutato. Per questo esaminiamo linguaggio, visione, riflessi e assetto posturale nella stessa sessione e leggiamo gli incroci fra le aree.<br> <b>Che cos'è questo screening.</b> Una prima osservazione breve, non una diagnosi: serve a individuare i bambini per i quali conviene guardare meglio. &nbsp;—&nbsp; <b>www.pnev.it</b>";
var V={}, view=0;

function n(k){var x=parseFloat(V[k]);return isFinite(x)?x:null}
function somma(k,len){var s=0,c=0;for(var i=0;i<len;i++){var v=V[k+i];if(v!==undefined&&v!==""){s+=parseInt(v,10);c++}}return{s:s,c:c}}

/* ---------- telebinocular ---------- */
function tbSi(){var i=parseInt(V.tbser||"0",10);return isNaN(i)?0:i}
function tbK(si,j,f){return "tb_"+TBSERIE[si].id+"_"+j+(f?"_"+f:"")}
function tbSet(si,j,v){var k=tbK(si,j);V[k]=(V[k]===v?"":v);sl();draw()}
function tbNum(si,j,f,v){V[tbK(si,j,f)]=v;sl()}
function tbSer(i){V.tbser=String(i);sl();draw()}
function tbStat(){
 var si=tbSi(),s=TBSERIE[si],o={si:si,fatti:0,tot:s.test.length,ko:[],sopp:""};
 s.test.forEach(function(t,j){
  if(t.prisma){if(V[tbK(si,j,"rot")])o.fatti++;return}
  var v=V[tbK(si,j)];if(!v)return;o.fatti++;
  if(t.ko.indexOf(v)>=0)o.ko.push(t.n+" · "+t.ab+" ("+v+")");
  if(v==="soppressione")o.sopp="test "+t.n;
  if(v==="solo OD")o.sopp="OS soppresso (test "+t.n+")";
  if(v==="solo OS")o.sopp="OD soppresso (test "+t.n+")";
 });
 return o;
}
function tbHTML(){
 var si=tbSi(),s=TBSERIE[si],h='<div class="tbser">';
 TBSERIE.forEach(function(x,i){h+='<button onclick="tbSer('+i+')" class="'+(i===si?"on":"")+'">'+x.nome+'</button>'});
 h+='</div><div class="mut" style="margin-bottom:8px">'+s.desc+'</div>';
 s.test.forEach(function(t,j){
  var sel=V[tbK(si,j)]||"",bad=sel&&t.ko.indexOf(sel)>=0;
  h+='<div class="tbt'+(sel?(bad?" ko":" ok"):"")+'"><div class="hd"><span class="n">'+t.n+'</span>'+
     '<span class="ab">'+t.ab+'</span><span class="dd">'+(t.d==="L"?"lontano":"vicino")+'</span></div>';
  if(t.prisma){
   h+='<div class="tbpri"><input type="number" placeholder="rottura Δ" value="'+(V[tbK(si,j,"rot")]||"")+
      '" oninput="tbNum('+si+','+j+',\'rot\',this.value)">'+
      '<input type="number" placeholder="recupero Δ" value="'+(V[tbK(si,j,"rec")]||"")+
      '" oninput="tbNum('+si+','+j+',\'rec\',this.value)"></div>';
  }else{
   h+='<div class="tbo">';
   t.o.forEach(function(o){var on=(sel===o);
    h+='<span class="'+(on?"sel"+(bad?" bad":""):"")+'" onclick="tbSet('+si+','+j+',\''+o.replace(/'/g,"\\'")+'\')">'+o+'</span>'});
   h+='</div>';
  }
  h+='</div>';
 });
 var st=tbStat();
 h+='<div><span class="tot">Compilati: <b>'+st.fatti+' / '+st.tot+'</b></span>'+
    '<span class="tot">Fuori dai limiti: <b>'+st.ko.length+'</b></span>'+
    (st.sopp?'<span class="tot">Soppressione: <b>'+st.sopp+'</b></span>':'')+'</div>';
 if(st.ko.length)h+='<div class="mut" style="margin-top:6px"><b>Da riportare:</b> '+st.ko.join(" · ")+'</div>';
 return h;
}

/* ---------- segnalazioni per area ---------- */
function flag(id){
 if(id==="tb"){var st=tbStat();if(!st.fatti)return null;return st.ko.length>0||!!st.sopp}
 if(id==="vis"){var ns=["ns_ia","ns_ip","ns_sa","ns_sp"].some(function(k){var v=n(k);return v&&v<=3});
  if(n("ppc")===null&&!ns)return null;return (n("ppc")>10)||ns}
 if(id==="lin"){var f=somma("fr",6),p=somma("np",8),i=n("intell");
  if(!f.c&&!p.c&&!i)return null;
  return (f.c===6&&f.s<=8)||(p.c===8&&p.s<=4)||(i>=3)}
 if(id==="app"){var d=somma("dt",8),tp=n("t_par"),tn=n("t_np");
  if(!d.c&&tp===null&&n("copia")===null&&n("fatti")===null)return null;
  var disc=(tp&&tn&&(tn/tp)>1.6);
  return (d.c===8&&d.s<=4)||disc||(n("copia")!==null&&n("copia")<=3)||
         (n("stacchi")!==null&&n("stacchi")>=6)||(n("fatti")!==null&&n("fatti")<=4)||V.presa==="a pugno"}
 if(id==="nm"){var g=somma("nm",9);if(!g.c&&!V.allin&&n("fuk")===null)return null;
  var due=0;for(var i2=0;i2<9;i2++){if(parseInt(V["nm"+i2]||0,10)>=2)due++}
  var cro=V.nm4!==undefined&&V.nm4!==""?parseInt(V.nm4,10):-1,
      omo=V.nm5!==undefined&&V.nm5!==""?parseInt(V.nm5,10):-1;
  return due>=2||parseInt(V.nm7||0,10)>=2||parseInt(V.nm8||0,10)>=2||
         (cro>=0&&omo>=0&&cro>omo)||(n("fuk")>45)}
 if(id==="mio"){if(!V.resp&&!V.flu)return null;
  return (V.resp==="orale"&&V.labbra==="incompetenti")||V.degl==="atipica"||
         V.flu==="disfluenze tipiche della balbuzie"}
 return null;
}
function CRIT(id){return {
 tb:"Anche un solo test fuori dai limiti, oppure soppressione.",
 vis:"PPC rottura oltre 10 cm, oppure una voce NSUCO a 3 o meno.",
 lin:"Frasi ≤ 8/12, oppure non parole ≤ 4/8, oppure intelligibilità 3 o superiore.",
 app:"Non parole marcatamente più lente delle parole, dettato ≤ 4/8, copia ≤ 3/6, 6 o più stacchi, fatti ≤ 4/8, presa a pugno.",
 nm:"Due o più prove a 2 o più, ATNR o STNR a 2 o più, crociati peggiori degli omolaterali, Fukuda oltre 45 gradi.",
 mio:"Respirazione orale con labbra incompetenti, deglutizione atipica, disfluenze tipiche della balbuzie."}[id]||""}

function semaforo(){
 var ids=["tb","vis","lin","app","nm","mio"],f=ids.map(flag);
 if(f.every(function(x){return x===null}))return{c:"n",t:"da compilare",ko:[]};
 var ko=ids.filter(function(id,i){return f[i]===true});
 if(f[2]===true||ko.length>=2)return{c:"r",t:"rosso — approfondimento consigliato",ko:ko};
 if(ko.length===1)return{c:"g",t:"giallo — ricontrollo a 6 mesi",ko:ko};
 return{c:"v",t:"verde — nessun seguito",ko:ko};
}

/* ---------- rendering ---------- */
function nav(){
 var e=document.getElementById("nav");e.innerHTML="";
 SCHEMA.forEach(function(s,i){
  var b=document.createElement("button");b.innerHTML=s.t.replace(/^(\d+) · /,"$1 · ")+'<i>'+s.m+'</i>';
  b.className=(view===i?"on":"");b.onclick=function(){view=i;draw()};e.appendChild(b);
 });
 var b=document.createElement("button");b.textContent="Esito";b.className=(view==="e"?"on":"");
 b.onclick=function(){view="e";draw()};e.appendChild(b);
}
function set(k,v){V[k]=v;sl();draw()}
function setq(k,v){V[k]=v;sl();prog()}
function fldHTML(f){
 var h='<div class="fld"><label>'+f.l+'</label>';
 if(f.t==="sel"){h+='<select onchange="set(\''+f.k+'\',this.value)">'+
   f.o.map(function(o){return '<option'+(V[f.k]===o?" selected":"")+'>'+o+'</option>'}).join("")+'</select>'}
 else{h+='<input type="'+(f.t==="num"?"number":f.t==="date"?"date":"text")+'" value="'+(V[f.k]||"")+
   '" oninput="setq(\''+f.k+'\',this.value)">'}
 return h+'</div>';
}
function draw(){
 nav();var m=document.getElementById("main");
 if(view==="e"){m.innerHTML=esito();prog();return}
 var s=SCHEMA[view],h='';
 if(view===0)h+='<div class="pnevbox">'+PNEVBOX+'</div>';
 h+='<div class="card"><h2>'+s.t+'</h2><div class="mut">tempo previsto '+s.m+'</div>';
 if(s.widget)h+=tbHTML();
 s.s.forEach(function(sec){
  if(sec.h)h+='<h3>'+sec.h+'</h3>';
  if(sec.cons)h+='<div class="cons"><b>Consegna.</b> «'+sec.cons+'»</div>';
  if(sec.items){
   h+='<table><thead><tr><th style="width:58%">Item</th>';
   sec.lab.forEach(function(l){h+='<th class="c">'+l+'</th>'});
   h+='</tr></thead><tbody>';
   sec.items.forEach(function(it,i){
    h+='<tr><td>'+it+'</td>';
    sec.lab.forEach(function(l,v){
     h+='<td class="c"><input type="radio" class="sc" name="'+sec.k+i+'" value="'+v+'"'+
        (V[sec.k+i]===String(v)?" checked":"")+' onchange="set(\''+sec.k+i+'\',\''+v+'\')"></td>';
    });
    h+='</tr>';
   });
   var t=somma(sec.k,sec.items.length);
   h+='</tbody></table><span class="tot">'+sec.tot+': <b>'+t.s+'</b> / '+(sec.items.length*sec.max)+
      ' <span class="mut">('+t.c+' di '+sec.items.length+')</span></span>';
  }
  if(sec.f){h+='<div class="row">'+sec.f.map(fldHTML).join("")+'</div>'}
 });
 var fl=flag(s.id);
 if(s.id!=="ana"){
  h+='<div class="flag '+(fl===null?"nd":fl?"si":"no")+'">SEGNALAZIONE: '+
     (fl===null?"dati insufficienti":fl?"SÌ":"no")+'</div><div class="crit">'+CRIT(s.id)+'</div>';
 }
 h+='</div>';
 m.innerHTML=h;prog();
}
function esito(){
 var sem=semaforo(),nomi={tb:"Telebinocular",vis:"Convergenza, motilità, dominanze",lin:"Linguaggio",
  app:"Apprendimenti",nm:"Neuromotorio e posturale",mio:"Miofunzionale e fluenza"};
 var h='<div class="card"><h2>Esito complessivo</h2><table><thead><tr><th>Area</th><th class="c" style="width:22%">Segnalata</th></tr></thead><tbody>';
 ["tb","vis","lin","app","nm","mio"].forEach(function(id){
  var f=flag(id);
  h+='<tr><td>'+nomi[id]+'</td><td class="c">'+(f===null?'<span class="mut">—</span>':f?'<b style="color:#b3261e">sì</b>':'no')+'</td></tr>';
 });
 h+='</tbody></table><div style="margin-top:12px"><span class="sem '+sem.c+'">'+sem.t+'</span></div>'+
    '<div class="crit" style="margin-top:7px">Rosso: linguaggio segnalato, oppure due o più aree. '+
    'Giallo: una sola area diversa dal linguaggio. Verde: nessuna area segnalata.</div>';
 h+='<div class="row">'+
    fldHTML({k:"consigli",l:"Approfondimento consigliato",t:"txt"})+
    fldHTML({k:"comunic",l:"Comunicazione alla famiglia",t:"txt"})+
    fldHTML({k:"note",l:"Note",t:"txt"})+'</div>';
 h+='</div><div class="sig">Screening breve 15 minuti — <b>Associazione The Organism</b> · www.pnev.it · © 2026 Giuseppe Ferraioli<br>'+
    'Prima osservazione funzionale: non costituisce diagnosi e non sostituisce una valutazione.</div>';
 return h;
}
function prog(){
 var sem=semaforo();
 document.getElementById("prog").textContent=(V.nome?V.nome+" — ":"")+sem.t;
}

/* ---------- persistenza ---------- */
var KEY="pnev_breve15_v1";
function sl(){try{localStorage.setItem(KEY,JSON.stringify(V))}catch(e){}}
function salva(){sl();msg("Salvato")}
function apri(){try{var x=localStorage.getItem(KEY);if(!x){msg("Nessun salvataggio");return}V=JSON.parse(x);draw();msg("Ripristinato")}catch(e){msg("Lettura non riuscita")}}
function esporta(){var b=new Blob([JSON.stringify(V,null,1)],{type:"application/json"});
 var a=document.createElement("a");a.href=URL.createObjectURL(b);
 a.download="screening15_"+((V.nome||"scheda").replace(/\W+/g,"_"))+"_"+(V.data||new Date().toISOString().slice(0,10))+".json";
 a.click();URL.revokeObjectURL(a.href)}
function importa(e){var fr=new FileReader();fr.onload=function(){try{V=JSON.parse(fr.result);draw();msg("Importato")}catch(y){msg("File non valido")}};fr.readAsText(e.target.files[0]);e.target.value=""}
function azzera(){if(!confirm("Iniziare una scheda nuova? I dati non esportati andranno persi."))return;V={};sl();view=0;draw();msg("Scheda nuova")}
function msg(m){var s=document.getElementById("msg");s.textContent=m;setTimeout(function(){s.textContent=""},3500)}
try{var x=localStorage.getItem(KEY);if(x)V=JSON.parse(x)}catch(e){}
draw();
