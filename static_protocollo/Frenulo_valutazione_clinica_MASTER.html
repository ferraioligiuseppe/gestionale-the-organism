<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valutazione del frenulo · The Organism</title>
<style>
:root{--v:#1D6B44;--vd:#155235;--b:#12385f;--line:#d7dfe8;--ink:#1d2a33;--mut:#5f6f7a;--bg:#f4f6f8;--warn:#b5651d}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--v)}a:hover{color:var(--vd)}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-bottom:3px solid var(--v);padding:8px 14px}
.topbar b{font-size:16px;color:var(--b)}.topbar .st{margin-left:auto;color:var(--mut);font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--b);padding:6px 10px}
.tabs button{background:none;border:0;color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
.tabs button.on{background:#fff;color:var(--b);font-weight:600}
main{max-width:1000px;margin:16px auto;padding:0 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
h2{margin:0 0 4px;color:var(--b);font-size:18px}h3{margin:14px 0 6px;font-size:14px;color:var(--vd)}
.mut{color:var(--mut);font-size:12.5px}.cons{background:#eef5f1;border-left:3px solid var(--v);padding:6px 10px;margin:8px 0;font-size:13px}
.warnbox{background:#fff6ea;border-left:3px solid var(--warn);padding:8px 12px;font-size:13px;margin:8px 0}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:6px 0}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff}
textarea{min-height:64px;width:100%}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
th{background:#f0f3f6;font-weight:600}td input,td select{width:100%;padding:4px 6px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:600;font-size:12.5px}
.g1{background:#e3f3e9;color:#155235}.g2{background:#fff4d6;color:#7a5600}.g3{background:#ffe6d1;color:#8a3b00}.g4{background:#fde0e0;color:#8a1c1c}
.timer{font:600 22px/1 ui-monospace,Menlo,monospace;color:var(--b)}
.btn{background:var(--v);color:#fff;border:0;border-radius:5px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.btn.sec{background:#5f6f7a}
.d-pos{color:#155235;font-weight:600}.d-neg{color:#8a1c1c;font-weight:600}
.hide{display:none}
@media print{.topbar,.tabs,.noprint{display:none!important}.sec-p{display:block!important}body{background:#fff}.card{border:0}}
</style></head><body>
<div class="topbar"><b>Valutazione del frenulo</b><span class="mut">Protocollo clinico · stessa batteria dello studio di ricerca</span><span class="st" id="stato">da compilare</span></div>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<script>
var USO='clinica'; /*USO*/
var V = {}; var KEY='pnev_frenulo_'+USO+'_v1';
try{ V = JSON.parse(localStorage.getItem(KEY)||'{}') || {}; }catch(e){ V={}; }
function sl(){ try{ localStorage.setItem(KEY, JSON.stringify(V)); }catch(e){} }
var FASI = USO==='clinica' ? ['T0','T1','T3'] : ['T0','T1','T2','T3'];
var NOMI_FASI = USO==='clinica'
  ? {T0:'Visita',T1:'Con anestetico (se applicato)',T3:'Controllo post frenulotomia'}
  : {T0:'T0 · baseline',T1:'T1 · gel A',T2:'T2 · gel B',T3:'T3 · post frenulotomia'};
// Batteria breve, ordine fisso (scheda operativa)
var TEST=[
 {id:'trmr',n:'1 · TRMR (controllo)',t:'1 min',campi:[['v','TRMR %','num']],nota:'Deve restare stabile: l\'anestetico non allunga il frenulo. Se cambia, è cambiata la collaborazione.'},
 {id:'stab',n:'2 · Stabilometria',t:'3 min',campi:[['ao_area','OA area ellisse mm²','num'],['ao_lung','OA lunghezza gomitolo mm','num'],['oc_area','OC area ellisse mm²','num'],['oc_lung','OC lunghezza gomitolo mm','num'],['romb','Quoziente di Romberg','num']],nota:'Durata: 15 s (4–7 anni), 30 s (8–14), 51,2 s (adolescenti/adulti). Più basso = più stabile.',meglio:'basso'},
 {id:'fuku',n:'3 · Fukuda',t:'1,5 min',campi:[['rot','Rotazione °','num'],['avanz','Avanzamento cm','num'],['lato','Lato','sel',['','destra','sinistra','nessuno']]],nota:'30 passi (4–7 anni), 50 passi dagli 8 anni.',meglio:'basso'},
 {id:'ppc',n:'4 · PPC',t:'1 min',campi:[['rott','Rottura cm','num'],['rec','Recupero cm','num']],nota:'Più vicino = migliore.',meglio:'basso'},
 {id:'cover',n:'5 · Cover test da vicino',t:'1 min',campi:[['pd','Deviazione Δ','num'],['tipo','Tipo','sel',['','orto','exo','eso','iper']]],meglio:'basso'},
 {id:'nsuco',n:'6 · NSUCO saccadi',t:'1,5 min',campi:[['ab','Abilità 1–5','num'],['ac','Accuratezza 1–5','num'],['te','Testa 1–5','num'],['co','Corpo 1–5','num']],nota:'Punteggio 1–5 per area: più alto = migliore.',meglio:'alto'},
 {id:'crt',n:'7 · Errore di riposizionamento cervicale (Revel)',t:'2 min',campi:[['dx','Dopo rotazione dx, cm','num'],['sx','Dopo rotazione sx, cm','num']],nota:'Dagli 8 anni. Errore in cm dal punto di partenza. Più basso = migliore.',meglio:'basso'},
 {id:'rifl',n:'8 · ATNR, STNR',t:'2 min',campi:[['atnr','ATNR 0–4','num'],['stnr','STNR 0–4','num']],nota:'0 = assente, 4 = completo. Più basso = migliore.',meglio:'basso'},
 {id:'suz',n:'9 · Suzione, Babkin',t:'1 min',campi:[['suz','Suzione 0–4','num'],['bab','Babkin 0–4','num']],meglio:'basso'}
];
var PROC = {"trmr":{"v":"https://m.youtube.com/shorts/CJF5CCquruw","p":"Paziente seduto, testa dritta. A: «apri la bocca più che puoi» — calibro tra i bordi degli incisivi centrali. B: «punta della lingua sulla papilla, dietro i denti di sopra, e apri più che puoi» senza staccarla. 3 misure alternate, media. Ripetute con almeno 10% di scarto: rifare."},"stab":{"v":"","p":"Pedana in stanza silenziosa, piedi nella posizione standard della pedana, braccia lungo i fianchi, sguardo su un punto a 2 m all'altezza degli occhi. Prima occhi aperti, poi occhi chiusi, con la durata della fascia d'età. Niente parlare durante la prova."},"fuku":{"v":"https://www.youtube.com/watch?v=ljGJbokAOXM","p":"Stanza silenziosa e poco illuminata, scalzo, piedi uniti al centro della griglia (cerchi di 0,5 e 1 m, settori di 30°). Braccia tese avanti a 90°, occhi chiusi o bendati. Marcia sul posto alzando le ginocchia, ritmo costante (contare o metronomo), senza indicazioni durante la prova. Alla fine: rotazione in gradi e spostamento in cm."},"ppc":{"v":"https://www.aao.org/education/1-minute-video/measuring-near-point-of-convergence-in-children","p":"Mira accomodativa a 40 cm sulla linea mediana, all'altezza della radice del naso. Avvicinare lentamente: rottura quando riferisce doppio o l'esaminatore vede un occhio deviare; poi allontanare fino al recupero. 3 prove di seguito."},"cover":{"v":"","p":"Mira accomodativa a 40 cm. Cover-uncover per le tropie, poi cover alternato per le forie, senza lasciare fondere tra un occhio e l'altro. Misura con la barra di prismi fino a neutralizzare il movimento."},"nsuco":{"v":"","p":"Paziente in piedi, senza istruzioni sulla testa. Due mire a 10 cm l'una dall'altra, a 40 cm, simmetriche rispetto alla linea mediana. «Guarda la rossa… guarda la verde», per 10 saccadi. Punteggio 1–5 in abilità, accuratezza, movimento della testa e del corpo."},"crt":{"v":"https://www.physiotutors.com/wiki/joint-position-sense-error/","p":"Seduto, puntatore laser sulla fronte, bersaglio a 90 cm. Occhi chiusi: ruotare lentamente la testa tutta a destra e tornare al punto di partenza, dicendo «ci sono». Misurare in cm la distanza dal centro. 3 prove per lato. Movimento lento: se è veloce si misura il vestibolo, non il collo."},"rifl":{"v":"","p":"Procedura INPP: posizione quadrupedica per ATNR (rotazione passiva lenta della testa) e STNR (flessione/estensione della testa). Punteggio 0–4 secondo la scala INPP, sempre con la stessa sequenza e lo stesso numero di ripetizioni."},"suz":{"v":"","p":"Suzione: sfioramento delle labbra. Babkin: pressione contemporanea sui palmi, paziente supino o seduto. Punteggio 0–4 INPP."}};
function procHtml(id){ var x=PROC[id]; if(!x) return '';
  return '<details style="margin:6px 0 10px"><summary style="cursor:pointer;color:#1D6B44;font-weight:600">📋 Come si fa (procedura standard)</summary><div style="font-size:13px;margin:6px 0">'+x.p+'</div>'+
    (x.v ? '<a href="'+x.v+'" target="_blank" rel="noopener" class="btn" style="text-decoration:none;display:inline-block">▶ Guarda il video</a>' : '<span class="mut">Video standard dello Studio da registrare.</span>')+'</details>'; }
var SEZ = USO==='clinica' ? [
 {id:'anamnesi',n:'1 · Paziente e anamnesi'},
 {id:'frenulo',n:'2 · Frenulo (TRMR)'},
 {id:'orali',n:'3 · Funzioni orali'},
 {id:'batteria',n:'4 · Batteria sistemica'},
 {id:'profilo',n:'Profilo e relazione'}
] : [
 {id:'disegno',n:'0 · Disegno e sicurezza'},
 {id:'frenulo',n:'1 · Frenulo (TRMR)'},
 {id:'orali',n:'2 · Funzioni orali (T0)'},
 {id:'batteria',n:'3 · Batteria T0 / T1 / T2'},
 {id:'confronto',n:'4 · Confronto'},
 {id:'esito',n:'Esito e relazione'}
];
var cur = V._tab || SEZ[0].id;
function g(k,d){ return V[k]==null ? (d==null?'':d) : V[k]; }
function inp(k,lab,tipo,opts){
  var val = g(k);
  if(tipo==='sel') return '<label>'+lab+'<select data-k="'+k+'">'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+o+'</option>'}).join('')+'</select></label>';
  if(tipo==='area') return '<label style="grid-column:1/-1">'+lab+'<textarea data-k="'+k+'">'+(val||'')+'</textarea></label>';
  if(tipo==='chk') return '<label class="chk"><input type="checkbox" data-k="'+k+'"'+(val?' checked':'')+'> '+lab+'</label>';
  return '<label>'+lab+'<input data-k="'+k+'" type="'+(tipo==='num'?'number':(tipo||'text'))+'" step="any" value="'+(val==null?'':String(val).replace(/"/g,'&quot;'))+'"></label>';
}
function num(k){ var x=parseFloat(String(g(k)).replace(',','.')); return isNaN(x)?null:x; }
function trmr(){
  var a=[],b=[]; for(var i=1;i<=3;i++){ var x=num('fr_a'+i), y=num('fr_b'+i); if(x&&y!=null){a.push(x);b.push(y);} }
  if(!a.length) return null;
  var ma=a.reduce(function(s,x){return s+x},0)/a.length, mb=b.reduce(function(s,x){return s+x},0)/b.length;
  return {a:ma,b:mb,r:mb/ma*100};
}
function grado(r){ if(r==null) return null; return r>80?1:r>=50?2:r>=25?3:4; }
var GTXT={1:'Mobilità normale (oltre 80%)',2:'Restrizione lieve (50–80%)',3:'Restrizione moderata (25–50%)',4:'Restrizione grave (sotto 25%)'};

var SOGLIE=[
 ['b_ppc_rott_T0','PPC, rottura oltre 5 cm',function(x){return x>5}],
 ['b_cover_pd_T0','Foria da vicino oltre 6 Δ',function(x){return Math.abs(x)>6}],
 ['b_nsuco_ac_T0','NSUCO accuratezza sotto 3',function(x){return x<3}],
 ['b_fuku_rot_T0','Fukuda, rotazione oltre 30° (50 passi)',function(x){return Math.abs(x)>30}],
 ['b_fuku_avanz_T0','Fukuda, spostamento oltre 50 cm (50 passi)',function(x){return x>50}],
 ['b_crt_dx_T0','Riposizionamento cervicale dx oltre 4,5 cm',function(x){return x>4.5}],
 ['b_crt_sx_T0','Riposizionamento cervicale sx oltre 4,5 cm',function(x){return x>4.5}],
 ['b_rifl_atnr_T0','ATNR 2 o più',function(x){return x>=2}],
 ['b_rifl_stnr_T0','STNR 2 o più',function(x){return x>=2}],
 ['b_suz_suz_T0','Suzione residua 2 o più',function(x){return x>=2}],
 ['b_suz_bab_T0','Babkin residuo 2 o più',function(x){return x>=2}]
];
function profilo(){
  var t=trmr(), gr=t?grado(t.r):null, segni=[];
  SOGLIE.forEach(function(s){ var x=num(s[0]); if(x!=null && s[2](x)) segni.push(s[1]); });
  var orali=[]; for(var i=0;i<5;i++) if(g('dg'+i)) orali.push(['spinta linguale','contrazione periorale','movimento del capo','interposizione linguale','residuo in bocca'][i]);
  if(g('rosenthal')&&g('rosenthal')!=='20 senza fatica') orali.push('respirazione nasale sotto carico: '+g('rosenthal'));
  if(g('post_oss')&&g('post_oss')!=='al palato (spot)') orali.push('lingua a riposo: '+g('post_oss'));
  var classe;
  if(gr==null) classe='Dati insufficienti: manca il TRMR.';
  else if(gr>=3) classe='Frenulo restrittivo (grado '+gr+'): la limitazione della lingua è evidente.';
  else if(segni.length>=2 || (segni.length>=1 && orali.length>=1)) classe='Frenulo funzionalmente adeguato (grado '+gr+') con segni sistemici: possibile perturbazione. Indicata la prova con anestetico topico, se il medico è disponibile.';
  else if(orali.length) classe='Frenulo funzionalmente adeguato (grado '+gr+') con segni orali isolati.';
  else classe='Nessun segno di perturbazione con questa batteria (grado '+gr+').';
  return {t:t,gr:gr,segni:segni,orali:orali,classe:classe};
}
function vista(){
  var h='';
  if(cur==='anamnesi'){
    h+='<div class="card"><h2>Valutazione del frenulo · uso clinico</h2><div class="mut">Protocollo per la pratica quotidiana: stessi test della ricerca, una sola visita. La prova con anestetico è facoltativa e la fa un medico o un odontoiatra.</div><div class="row">'+inp('nome','Cognome e nome')+inp('dn','Data di nascita','date')+inp('data','Data della visita','date')+inp('fascia','Fascia d\'età','sel',['','4–7 anni','8–14 anni','adolescenti/adulti'])+inp('esaminatore','Esaminatore')+inp('inviante','Inviato da')+'</div></div>';
    h+='<div class="card"><h3>Anamnesi mirata</h3>'+['Difficoltà di allattamento o di suzione','Frenulotomia o frenulectomia già fatta','Difficoltà di parola (/r/, /l/, fricative)','Masticazione lenta o selettività alimentare','Respirazione orale, russamento','Dolore o rigidità cervicale','Mal di testa frequente','Fastidio visivo da vicino, lettura faticosa','Vertigini o instabilità','Malocclusione o trattamento ortodontico'].map(function(t,i){return inp('an'+i,t,'chk')}).join('')+inp('an_note','Note','area')+'</div>';
  }
  if(cur==='profilo'){
    var p=profilo();
    h+='<div class="card"><h2>Profilo</h2><p><b>TRMR:</b> '+(p.t?p.t.r.toFixed(1)+'% · grado '+p.gr+' ('+GTXT[p.gr]+')':'—')+'</p><div class="cons">'+p.classe+'</div>'+
      '<h3>Segni sistemici ('+p.segni.length+')</h3>'+(p.segni.length?'<ul>'+p.segni.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>':'<p class="mut">Nessuno oltre le soglie.</p>')+
      '<h3>Segni orali ('+p.orali.length+')</h3>'+(p.orali.length?'<ul>'+p.orali.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>':'<p class="mut">Nessuno.</p>')+
      '<div class="mut">Le soglie sono criteri indicativi dello Studio, non norme tarate. Servono a decidere se approfondire, non a porre una diagnosi.</div></div>';
    h+='<div class="card"><h3>Relazione</h3><div class="row">'+inp('indicazione','Indicazione','sel',['','nessun intervento','rivalutazione a 6 mesi','prova con anestetico topico','terapia miofunzionale','valutazione chirurgica','inserimento nello studio di ricerca'])+'</div>'+inp('relazione','Testo della relazione (modificabile)','area')+'<button class="btn" id="genrel" type="button">Scrivi la bozza dai dati</button></div>';
  }
  if(cur==='disegno'){
    h+='<div class="card"><h2>Razionale e disegno</h2><p>Il frenulo linguale corto viene trattato come <b>perturbazione del sistema</b>. Si misura il sistema con il frenulo attivo, poi con le sue afferenze spente con un anestetico topico, e si confronta.</p>'+
    '<div class="cons"><b>Componente afferente:</b> miglioramento con l\'anestetico e non con il placebo.<br><b>Componente meccanica:</b> nessun cambiamento con l\'anestetico, cambiamento dopo la frenulotomia.</div>'+
    '<table><tr><th>Fase</th><th>Condizione</th><th>Batteria</th><th>Quando</th></tr><tr><td>T0</td><td>Baseline</td><td>Completa</td><td>Giorno 1</td></tr><tr><td>T1</td><td>Gel A (in cieco)</td><td>Breve</td><td>Giorno 1, dopo T0</td></tr><tr><td>T2</td><td>Gel B (condizione opposta)</td><td>Breve, con baseline breve</td><td>Giorno 2, a 2–7 giorni</td></tr><tr><td>T3</td><td>Post frenulotomia (opzionale)</td><td>Completa</td><td>A 2 settimane e a 3 mesi</td></tr></table></div>';
    h+='<div class="card"><h3>Modalità dello studio</h3><div class="row">'+inp('modalita','Disegno','sel',['','pilota aperto (senza cieco, senza controllo)','doppio cieco con placebo'])+'</div><div class="mut">Nel pilota aperto si applica solo l\'anestetico a T1: non c\'è T2 né busta. Nel doppio cieco T1 e T2 sono gel A e gel B in ordine randomizzato.</div></div>';
    h+='<div class="card"><h3>Dati della seduta</h3><div class="row">'+inp('nome','Cognome e nome')+inp('dn','Data di nascita','date')+inp('data','Data T0','date')+inp('fascia','Fascia d\'età','sel',['','4–7 anni','8–14 anni','adolescenti/adulti'])+inp('esaminatore','Esaminatore')+inp('applicatore','Medico/odontoiatra applicatore')+inp('codice','Codice busta (randomizzazione)')+'</div>'+
    '<div class="mut">La busta la gestisce l\'applicatore: esaminatore e paziente non sanno quale gel è stato applicato fino al confronto.</div></div>';
    h+='<div class="card"><h3>Sicurezza — verifica dell\'applicatore</h3><div class="warnbox">L\'anestetico lo prescrive e lo applica un medico o un odontoiatra. Solo topico, sul frenulo, in quantità minima. Niente blocco del nervo linguale. Benzocaina da evitare sotto i 2 anni.</div>'+
    ['Nessuna allergia agli anestetici locali','Nessuna cardiopatia o aritmia non valutata','Nessuna epilessia non controllata','Nessuna lesione della mucosa orale','Dose calcolata dal medico sul peso','Placebo uguale per aspetto, gusto e consistenza','Consenso informato scritto (entrambi i genitori per i minori)','Assenso del minore (dagli 8 anni)','Parere del comitato etico (se i dati saranno pubblicati)','Stessa stanza, ora e luce dei due giorni; niente notte insonne né sport nelle 2 ore prima'].map(function(t,i){return inp('sic'+i,t,'chk')}).join('')+'</div>';
  }
  if(cur==='frenulo'){
    var t=trmr(), gr=t?grado(t.r):null;
    h+='<div class="card"><h2>TRMR — Tongue Range of Motion Ratio (Yoon 2017)</h2><div class="cons"><b>A</b> «Apri la bocca più che puoi» · <b>B</b> «Metti la punta della lingua qui dietro i denti, sul palato, e apri più che puoi». Calibro in mm, 3 misure alternate.</div>'+procHtml('trmr')+
    '<table><tr><th>Prova</th><th>A · apertura massima (mm)</th><th>B · lingua sulla papilla (mm)</th></tr>'+[1,2,3].map(function(i){return '<tr><td>'+i+'</td><td>'+inp('fr_a'+i,'','num')+'</td><td>'+inp('fr_b'+i,'','num')+'</td></tr>'}).join('')+'</table>'+
    (t?'<p style="margin-top:12px">TRMR = B / A × 100 = <b>'+t.r.toFixed(1)+'%</b> &nbsp; <span class="pill g'+gr+'">Grado '+gr+' · '+GTXT[gr]+'</span></p>':'<p class="mut">Inserisci almeno una coppia A/B.</p>')+
    '<div class="mut">Ipotesi del protocollo: anche un frenulo di grado 1–2, che muove la lingua in modo apparentemente adeguato, può perturbare il sistema. Il TRMR descrive la mobilità, non esclude la perturbazione.</div>'+
    '<h3>Osservazione</h3><div class="row">'+inp('fr_inserz','Inserzione linguale','sel',['','apice','sotto l\'apice','metà lingua','base'])+inp('fr_forma','Forma della lingua in elevazione','sel',['','normale','a cuore','piatta','asimmetrica'])+inp('fr_tipo','Frenulo','sel',['','sottile/elastico','spesso/fibroso','sottomucoso'])+'</div>'+inp('fr_note','Note sull\'osservazione','area')+'</div>';
  }
  if(cur==='orali'){
    h+='<div class="card"><h2>Funzioni orali — solo a T0</h2><h3>Deglutizione di acqua</h3><div class="mut">Tre sorsi liberi, poi deglutizione con labbra divaricate.</div>'+
    ['Spinta linguale anteriore','Contrazione periorale','Movimento del capo','Interposizione linguale','Residuo in bocca'].map(function(t,i){return inp('dg'+i,t,'chk')}).join('')+
    '<h3>Respirazione</h3><div class="row">'+inp('glatzel','Specchio di Glatzel','sel',['','simmetrico','ridotto a dx','ridotto a sx','ridotto bilaterale'])+inp('rosenthal','Test di Rosenthal (20 respiri nasali)','sel',['','20 senza fatica','20 con fatica','apre la bocca prima'])+inp('ros_n','Se apre: dopo quanti respiri','num')+'</div>'+
    '<h3>Postura linguale a riposo</h3><div class="row">'+inp('post_oss','Osservata','sel',['','al palato (spot)','sui denti inferiori','tra i denti','pavimento della bocca'])+inp('post_rif','Riferita dal paziente (dagli 8 anni)','text')+inp('labbra','Labbra a riposo','sel',['','chiuse','socchiuse','aperte'])+'</div>'+inp('orali_note','Note','area')+'</div>';
  }
  if(cur==='batteria'){
    var fasci=g('fascia');
    h+='<div class="card noprint"><h2>Batteria breve · ordine fisso</h2><div class="mut">La finestra utile dell\'anestetico topico è di 15–30 minuti: la batteria breve parte subito e si chiude entro 15 minuti.'+(fasci?' Fascia: <b>'+fasci+'</b>.':'')+'</div>'+
    '<div style="display:flex;gap:12px;align-items:center;margin-top:8px"><span class="timer" id="tm">15:00</span><button class="btn" id="tmgo">▶ Avvia 15 minuti</button><button class="btn sec" id="tmst">■ Ferma</button></div></div>';
    TEST.forEach(function(te){
      h+='<div class="card"><h3>'+te.n+' <span class="mut">· '+te.t+'</span></h3>'+(te.nota?'<div class="mut">'+te.nota+'</div>':'')+procHtml(te.id)+
      '<table><tr><th>Misura</th>'+FASI.map(function(f){return '<th>'+NOMI_FASI[f]+'</th>'}).join('')+'</tr>'+
      te.campi.map(function(c){return '<tr><td>'+c[1]+'</td>'+FASI.map(function(f){return '<td>'+inp('b_'+te.id+'_'+c[0]+'_'+f,'',c[2],c[3])+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
    });
  }
  if(cur==='confronto'){
    var aperto = String(g('modalita')).indexOf('pilota')===0;
    if(aperto){ h+='<div class="card"><h2>Confronto</h2><div class="mut">Pilota aperto: T1 è l\'anestetico, non c\'è placebo. Un miglioramento a T1 è compatibile con una componente afferente, ma senza placebo non si può escludere l\'effetto del solo gel in bocca o dell\'aspettativa.</div></div>'; }
    else { h+='<div class="card"><h2>Confronto</h2><div class="row">'+inp('gelA','Il gel A era…','sel',['','non ancora svelato','anestetico','placebo'])+'</div><div class="mut">Svela solo a batterie concluse. Il gel B è la condizione opposta.</div></div>'; }
    var gA=g('gelA'), anes = aperto?'T1':(gA==='anestetico'?'T1':gA==='placebo'?'T2':null), plac = aperto?null:(anes==='T1'?'T2':anes==='T2'?'T1':null);
    h+='<div class="card"><table><tr><th>Test · misura</th><th>T0</th><th>Δ anestetico</th><th>Δ placebo</th><th>Δ post frenulotomia</th></tr>';
    TEST.forEach(function(te){ te.campi.forEach(function(c){ if(c[2]!=='num') return;
      var base=num('b_'+te.id+'_'+c[0]+'_T0'); function d(f){ if(!f) return '—'; var x=num('b_'+te.id+'_'+c[0]+'_'+f); if(x==null||base==null) return '—'; var dd=x-base; var buono = te.meglio==='alto'? dd>0 : dd<0; return '<span class="'+(dd===0?'':buono?'d-pos':'d-neg')+'">'+(dd>0?'+':'')+dd.toFixed(1)+'</span>'; }
      h+='<tr><td>'+te.n.replace(/^\d+ · /,'')+' · '+c[1]+'</td><td>'+(base==null?'—':base)+'</td><td>'+d(anes)+'</td><td>'+d(plac)+'</td><td>'+d('T3')+'</td></tr>'; }); });
    h+='</table><div class="mut" style="margin-top:8px">Verde = miglioramento rispetto a T0, rosso = peggioramento. <b>Afferente</b>: cambia con l\'anestetico e non con il placebo. <b>Meccanica</b>: non cambia con l\'anestetico, cambia dopo la frenulotomia.</div></div>';
  }
  if(cur==='esito'){
    var t2=trmr(),gr2=t2?grado(t2.r):null;
    h+='<div class="card"><h2>Esito</h2><p>TRMR: '+(t2?'<b>'+t2.r.toFixed(1)+'%</b> · grado '+gr2:'—')+' · Gel A: <b>'+(g('gelA')||'non svelato')+'</b></p><div class="row">'+inp('lettura','Lettura del caso','sel',['','componente afferente','componente meccanica','entrambe','nessuna perturbazione rilevata','dati insufficienti'])+'</div>'+inp('esito_note','Sintesi clinica','area')+inp('relazione','Relazione (modificabile, per la cartella)','area')+'</div>';
  }
  document.getElementById('app').innerHTML=h;
  document.getElementById('tabs').innerHTML=SEZ.map(function(s){return '<button data-t="'+s.id+'" class="'+(s.id===cur?'on':'')+'">'+s.n+'</button>'}).join('');
  var n=Object.keys(V).filter(function(k){return k[0]!=='_'&&V[k]!==''&&V[k]!=null&&V[k]!==false}).length;
  document.getElementById('stato').textContent = n? n+' campi compilati' : 'da compilare';
  timerBind();
}
document.addEventListener('click',function(e){
  if(e.target.id==='genrel'){ var p=profilo();
    var testo='Valutazione del frenulo linguale'+(g('nome')?' di '+g('nome'):'')+(g('data')?', '+g('data'):'')+'.\n\n'+
      'Mobilità linguale (TRMR): '+(p.t?p.t.r.toFixed(0)+'%, grado '+p.gr+' — '+GTXT[p.gr].toLowerCase():'non misurata')+'.\n'+
      (p.orali.length?'Funzioni orali: '+p.orali.join('; ')+'.\n':'Funzioni orali nella norma.\n')+
      (p.segni.length?'Alla batteria sistemica: '+p.segni.join('; ').toLowerCase()+'.\n':'Batteria sistemica senza segni oltre le soglie.\n')+
      '\n'+p.classe+(g('indicazione')?'\nIndicazione: '+g('indicazione')+'.':'');
    V.relazione=testo; sl(); vista(); return; }
  var b=e.target.closest('[data-t]'); if(b){ cur=V._tab=b.dataset.t; sl(); vista(); window.scrollTo(0,0);} });
document.addEventListener('change',function(e){ var k=e.target.dataset&&e.target.dataset.k; if(!k) return;
  V[k]= e.target.type==='checkbox'? e.target.checked : e.target.value; sl();
  if(/^fr_|^gelA|^b_|^modalita/.test(k) && (cur==='frenulo'||cur==='confronto'||cur==='esito')) vista(); else { var n=Object.keys(V).filter(function(x){return x[0]!=='_'&&V[x]}).length; document.getElementById('stato').textContent=n+' campi compilati'; } });
var tmI=null, tmEnd=null;
function timerBind(){ var go=document.getElementById('tmgo'), stp=document.getElementById('tmst'); if(!go) return;
  go.onclick=function(){ tmEnd=Date.now()+15*60000; clearInterval(tmI); tmI=setInterval(tick,500); tick(); };
  stp.onclick=function(){ clearInterval(tmI); tmI=null; };
  if(tmI) tick(); }
function tick(){ var el=document.getElementById('tm'); if(!el||!tmEnd) return; var s=Math.max(0,Math.round((tmEnd-Date.now())/1000));
  el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); el.style.color = s<180?'#8a1c1c':''; if(!s){clearInterval(tmI);} }
vista();
</script></body></html>
