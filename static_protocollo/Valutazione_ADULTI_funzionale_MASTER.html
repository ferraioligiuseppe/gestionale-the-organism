<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valutazione adulti — funzionale completa — Studio The Organism</title>
<style>
:root{--navy:#123A6B;--green:#1D6B44;--line:#c9d2dd;--bg:#eef1f5;--alert:#b3261e;--warn:#b4601a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#16202c;background:var(--bg)}
header{background:#fff;border-bottom:3px solid var(--green);padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
header img{height:32px}header .t{font-weight:600;color:var(--navy)}header .sp{flex:1}
nav{display:flex;gap:3px;flex-wrap:wrap;background:var(--navy);padding:6px 12px;position:sticky;top:53px;z-index:29}
nav button{background:transparent;border:0;color:#cfdcee;padding:6px 10px;border-radius:5px;font-size:12.5px;cursor:pointer}
nav button.on{background:#fff;color:var(--navy);font-weight:600}
nav button i{font-style:normal;opacity:.65;font-size:11px;margin-left:4px}
main{max-width:940px;margin:14px auto;padding:0 12px 96px}
.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:11px}
.card h2{margin:0 0 3px;font-size:15.5px;color:var(--navy)}
.card h3{margin:13px 0 5px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.pnevbox{background:#f2f6fa;border-left:4px solid var(--green);border-radius:0 5px 5px 0;padding:10px 13px;font-size:12.5px;line-height:1.5;margin-bottom:11px}
.pnevbox b{color:var(--navy)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;margin-top:8px}
.fld label{display:block;font-size:11.5px;color:#54606d;margin-bottom:2px}
.fld input,.fld select{width:100%;border:1px solid #dde3ea;border-radius:5px;padding:6px 7px;background:#fbfcfd}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--green);background:#f3f9f5}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;font-size:12.5px}
td{border-bottom:1px solid #e6eaef;padding:5px 8px}
td.c,th.c{text-align:center}
.sc{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.cons{background:#eef4ef;border-left:3px solid var(--green);padding:7px 10px;font-size:13px;margin:8px 0;border-radius:0 4px 4px 0}
.cons b{color:var(--green)}
.tot{display:inline-block;background:#eef2f7;border-radius:5px;padding:4px 10px;font-size:13px;margin:7px 7px 0 0}
.tot b{color:var(--navy)}
.flag{border-radius:6px;padding:9px 12px;margin-top:11px;font-size:14px;font-weight:600}
.flag.no{background:#e9f3ec;color:var(--green)}.flag.si{background:#fbe9e7;color:var(--alert)}
.flag.nd{background:#f1f3f6;color:#64707d}
.crit{font-size:12px;color:#64707d;margin-top:5px}
.tbser{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 9px}
.tbser button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--navy)}
.tbser button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.tbt{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:7px 10px;margin-bottom:6px;background:#fff}
.tbt.ok{border-left-color:var(--green)}.tbt.ko{border-left-color:var(--alert)}
.tbt .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tbt .n{font-weight:600;color:var(--navy);min-width:28px}
.tbt .ab{flex:1;font-size:14px}.tbt .dd{font-size:11.5px;color:#5a6673;background:#eef2f7;border-radius:9px;padding:1px 7px}
.tbo{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tbo span{border:1px solid var(--line);background:#fbfcfd;border-radius:14px;padding:6px 12px;font-size:13px;cursor:pointer}
.tbo span.sel{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.tbo span.sel.bad{background:var(--alert);border-color:var(--alert)}
.tbpri{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.tbgw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.tbg{min-width:820px}
.tbgr{display:grid;grid-template-columns:150px 72px 72px minmax(0,2.5fr) minmax(0,1.4fr) minmax(0,1.9fr) 76px;border-bottom:1px solid #e6ebf0}
.tbgh{background:#f3f6f9;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5a6673}
.tbgh>div{padding:8px 6px;text-align:center;line-height:1.25}.tbgh>div:first-child{text-align:left;padding-left:10px}
.tbgh small{display:block;font-weight:400;text-transform:none;letter-spacing:0}
.tbgh .zs{background:#fbf3e8;color:#9a5b12}.tbgh .za{background:#e7f1eb;color:#155235}.tbgh .zv{background:#f8eceA;color:#8a3a2e}
.tbgsep{padding:5px 10px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.tbgl{padding:7px 10px;display:flex;flex-direction:column;gap:2px;justify-content:center;font-size:13px;line-height:1.25}
.tbgl b{color:var(--navy);font-size:12px}
.tbgz{padding:6px 4px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;border-left:1px solid #eef1f4}
.tbc{min-width:28px;min-height:26px;padding:3px 6px;border:1px solid #c9d2dd;border-radius:13px;background:#fff;font:500 12px/1.15 ui-monospace,Menlo,monospace;
 display:inline-flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.tbc:hover{border-color:var(--green);background:#f3f8f5}
.tbc.lim::after{content:"*";color:#9a5b12}
.tbc.on{background:#1a1d1b;border:2px solid #1a1d1b;color:#fff;font-weight:600}
.tbc.nd{align-self:flex-start;margin-top:3px;font-size:11px;min-height:22px}
.tbgz i{font-style:normal;font-size:11px;font-weight:600;border-radius:10px;padding:4px 8px;white-space:nowrap}
.tbgz i.ok{background:#e7f1eb;color:#155235}.tbgz i.ko{background:var(--alert);color:#fff}.tbgz i.nn{color:#9aa4ae;font-weight:400}
@media print{.tbgw{overflow:visible;border-color:#999}.tbg{min-width:0}.tbgr{grid-template-columns:128px 46px 46px 2.6fr 1.5fr 2fr 50px}
 .tbc{min-width:22px;min-height:20px;padding:2px 4px;font-size:9.5px;border-color:#888}.tbgl{font-size:10.5px}
 .tbgh{font-size:8.5px}.tbgr{break-inside:avoid}}
.tbpri input{border:1px solid #dde3ea;border-radius:5px;padding:5px 7px;font-size:13px;width:125px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;z-index:31}
button.act{background:var(--navy);color:#fff;border:0;border-radius:5px;padding:8px 13px;font-size:13.5px;cursor:pointer}
button.act.g{background:var(--green)}button.act.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.bar .sp{flex:1}
.sem{display:inline-block;padding:5px 14px;border-radius:15px;font-size:15px;font-weight:600}
.sem.v{background:#e9f3ec;color:var(--green)}.sem.g{background:#fdf1e3;color:var(--warn)}
.sem.r{background:#fbe9e7;color:var(--alert)}.sem.n{background:#f1f3f6;color:#64707d}
.mut{color:#64707d;font-size:12.5px}
.sig{text-align:center;font-size:11.5px;color:#7a8594;margin-top:16px}.sig b{color:var(--green)}
.scbtn{margin-top:4px;background:var(--green);color:#fff;border:0;border-radius:5px;padding:6px 10px;font-size:12.5px;cursor:pointer;width:100%}
#scov{position:fixed;inset:0;background:#0d1b2a;color:#fff;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#scov.on{display:flex}
#scval{font-size:74px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#scval small{font-size:24px;font-weight:400;opacity:.75}
#scov .hint{font-size:14px;opacity:.8;max-width:420px;line-height:1.5}
#scov .rowb{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
#scov button{border:0;border-radius:7px;padding:11px 18px;font-size:15px;cursor:pointer}
#scov .b1{background:#fff;color:#123A6B;font-weight:600}
#scov .b2{background:#274b6d;color:#fff}
#scov .b3{background:var(--green);color:#fff;font-weight:600}
#scov .ax{font-size:13px;opacity:.8}
#scov .warn{background:#5a3b1c;border-radius:7px;padding:10px 14px;font-size:13.5px;max-width:460px}
@media print{header,nav,.bar,.noprint{display:none!important}body{background:#fff}
 .card{border:0;border-bottom:1px solid #ccc;border-radius:0;page-break-inside:avoid}
 .tbo span{border:1px solid #999}.tbo span.sel{background:#123a6b;color:#fff}}

.fld.wide{grid-column:1/-1}.fld textarea{width:100%;border:1px solid #dde3ea;border-radius:5px;padding:6px 7px;background:#fbfcfd;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:#16202c}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
nav button.extra{box-shadow:inset 0 -2px 0 #e0b35a}nav b.med{font-size:10px;background:#b4601a;color:#fff;border-radius:8px;padding:1px 5px;margin-left:3px}
.redf{margin-top:11px;border-radius:6px;padding:10px 12px;background:#fbe9e7;border:1px solid #efb7b0;color:#7d1a13;font-size:13.5px;line-height:1.5}
.brano{background:#fbfaf6;border:1px solid #e6e1d4;border-radius:6px;padding:12px 15px;font:17px/1.7 Georgia,serif;margin:6px 0}.brano .bt{font-weight:bold;margin-bottom:6px}
.stroop{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 14px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin:6px 0;font:700 20px/1.2 Helvetica,Arial,sans-serif;text-align:center}
.wbox{border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin:6px 0;background:#fbfcfd}.wrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bad{color:var(--alert);font-weight:600}.good{color:var(--green);font-weight:600}
.act{border:0;border-radius:5px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}.act.g{background:var(--green);color:#fff}.act.o{background:#fff;border:1px solid var(--line);color:var(--navy)}
#stov{position:fixed;inset:0;z-index:100;background:#000;color:#eee;display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto}
#stov>*:first-child{margin-top:auto}#stov>*:last-child{margin-bottom:auto}
.stset{background:#fff;color:#16202c;border-radius:8px;max-width:620px;width:94%;padding:18px 20px;margin:20px 0}.stset h2{margin:0 0 6px;color:var(--navy)}.stset h3{margin:14px 0 4px;font-size:13px;text-transform:uppercase;color:var(--navy)}
#stcard{border:2px dashed var(--green);border-radius:8px;aspect-ratio:85.6/54;margin:8px 0;max-width:100%}
.strow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}.strow label{font-size:13px;display:flex;flex-direction:column;gap:3px}.strow input,.strow select{border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:inherit}
.sttop{display:flex;gap:14px;align-items:center;justify-content:center;padding:8px;color:#ddd;font-size:15px}
.starena{display:grid;grid-template-columns:70px auto 70px;grid-template-rows:60px auto 60px;align-items:center;justify-items:center;gap:4px}.starena canvas{grid-column:2;grid-row:2;image-rendering:pixelated}
.sta{width:62px;height:52px;border-radius:8px;border:1px solid #555;background:#1b1b1b;color:#fff;font-size:22px;cursor:pointer}.sta.u{grid-column:2;grid-row:1}.sta.d{grid-column:2;grid-row:3}.sta.l{grid-column:1;grid-row:2}.sta.r{grid-column:3;grid-row:2}
.lus{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.lus span{padding:8px 12px;border-radius:5px;font-size:13px;font-weight:600}</style></head>

<script>

var V={},view="ana";
function n(k){var x=parseFloat(V[k]);return isFinite(x)?x:null}
function somma(k,len){var s=0,c=0;for(var i=0;i<len;i++){var v=V[k+i];if(v!==undefined&&v!==""){s+=parseInt(v,10);c++}}return{s:s,c:c}}
function tutti(k,len){return somma(k,len).c===len}
function has(k,v){var a=V[k];return Array.isArray(a)&&a.indexOf(v)>=0}
function eta(){if(V.dn){var d=new Date(V.dn),o=V.data?new Date(V.data):new Date();if(!isNaN(d))return o.getFullYear()-d.getFullYear()-((o.getMonth()<d.getMonth()||(o.getMonth()===d.getMonth()&&o.getDate()<d.getDate()))?1:0)}var m=String(V.eta||"").match(/\d+/);return m?parseInt(m[0],10):null}
function inS(s){return !s.mot||s.mot.some(function(m){return has("motivo",m)})}
function sezioni(){return SCHEMA.filter(inS)}
function AREE(){return sezioni().map(function(s){return s.id}).filter(function(id){return id!=="ana"})}
function CLIN(){return AREE().filter(function(id){return INDIC.indexOf(id)<0})}
function flag(id){var f=FLAGS[id];if(!f)return null;try{return f()}catch(e){return null}}
function rossi(){var r=[];REDS.forEach(function(x){try{if(x.c())r.push(x.t)}catch(e){}});return r}
function semaforo(){var ids=CLIN(),f=ids.map(flag);
 if(f.every(function(x){return x===null})&&!rossi().length)return{c:"n",t:"da compilare",ko:[]};
 var ko=ids.filter(function(id,i){return f[i]===true}),r=rossi(),forte=ko.filter(function(id){return FORTI.indexOf(id)>=0});
 if(r.length||forte.length||ko.length>=ROSSO)return{c:"r",t:"rosso — "+(r.length||forte.length?INVIO:"approfondimento consigliato"),ko:ko};
 if(ko.length)return{c:"g",t:"giallo — approfondimento nelle aree segnalate",ko:ko};
 return{c:"v",t:"verde — nessun seguito",ko:ko}}
function set(k,v){V[k]=v;sl();draw()}
function setq(k,v){V[k]=v;sl();prog()}
function tog(k,v){var a=Array.isArray(V[k])?V[k].slice():[];var i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);V[k]=a;sl();draw()}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function fldHTML(f){var h='<div class="fld'+(f.t==="multi"||f.t==="area"?' wide':'')+'"><label>'+f.l+'</label>';
 if(f.t==="sel")return h+'<select onchange="set(\''+f.k+'\',this.value)">'+f.o.map(function(o){return '<option'+(V[f.k]===o?" selected":"")+'>'+o+'</option>'}).join("")+'</select></div>';

 try{localStorage.setItem("pnev_stereo_cal",JSON.stringify(ST.cal))}catch(e){}
 var L=stLivelli(),e=document.getElementById("stlv");if(!e)return;
 e.innerHTML='Livelli misurabili su questo schermo a '+ST.cal.dist+' cm: <b>'+L.map(function(x){return x.a+'″'}).join(' · ')+'</b>'+
  (L.length&&L[L.length-1].a>STcrit()?'<br><span class="bad">Il livello più fine è sopra il criterio della fascia ('+STcrit()+'″): allontanati dallo schermo.</span>':'')}
function stVia(){ST.L=stLivelli();if(!ST.L.length){alert("Schermo o distanza non adatti: allontanati.");return}
 ST.i=0;ST.ok=0;ST.ko=0;ST.prova=2;ST.pass=null;var o=stOv();
 o.innerHTML='<div class="sttop"><span id="stst"></span><button class="act o" onclick="stChiudi()">Interrompi</button></div>'+
  '<div class="starena"><button class="sta u" onclick="stRisp(0)">▲</button><button class="sta l" onclick="stRisp(3)">◀</button>'+
  '<canvas id="stcv"></canvas><button class="sta r" onclick="stRisp(1)">▶</button><button class="sta d" onclick="stRisp(2)">▼</button></div>'+
  '<div class="sttop"><button class="act o" onclick="stRisp(-1)">Non lo vedo</button><span id="stfb"></span></div>';
 stTrial()}
function stTrial(){ST.pos=Math.floor(Math.random()*4);var lv=ST.L[ST.i],cv=document.getElementById("stcv"),dpr=window.devicePixelRatio||1;
 var css=Math.floor(Math.min(window.innerWidth-160,window.innerHeight-190,620));cv.style.width=css+"px";cv.style.height=css+"px";
 var W=Math.floor(css*dpr);cv.width=W;cv.height=W;var ctx=cv.getContext("2d"),img=ctx.createImageData(W,W),D=img.data;
 var cell=Math.max(2,Math.round(2*dpr)),nc=Math.ceil(W/cell)+Math.ceil(lv.d/cell)+2,P=new Uint8Array(nc*nc);
 for(var i=0;i<P.length;i++)P[i]=Math.random()<0.5?1:0;
 var sz=Math.floor(W*0.26),off=Math.floor(W*0.25),cx=W/2,cy=W/2;
 var tx=[cx,cx+off,cx,cx-off][ST.pos]-sz/2,ty=[cy-off,cy,cy+off,cy][ST.pos]-sz/2,d=lv.d,rs=ST.cal.rossoSx;
 for(var y=0;y<W;y++){var ry=Math.floor(y/cell)*nc;for(var x=0;x<W;x++){
  var inT=x>=tx&&x<tx+sz&&y>=ty&&y<ty+sz,l=P[ry+Math.floor(x/cell)],r=inT?P[ry+Math.floor((x+d)/cell)]:l;
  var a=rs?l:r,b=rs?r:l,k=(y*W+x)*4;D[k]=a?255:0;D[k+1]=b?255:0;D[k+2]=b?255:0;D[k+3]=255}}
 ctx.putImageData(img,0,0);
 document.getElementById("stst").textContent=(ST.prova>0?"Prova di allenamento":"Livello "+lv.a+"″ ("+(ST.i+1)+" di "+ST.L.length+")");
}
function stRisp(p){var giusto=p===ST.pos,fb=document.getElementById("stfb");
 if(ST.prova>0){ST.prova--;fb.textContent=giusto?"Giusto!":"Era "+["in alto","a destra","in basso","a sinistra"][ST.pos];stTrial();return}
 fb.textContent="";if(giusto)ST.ok++;else ST.ko++;
 if(ST.ok>=2){ST.pass=ST.L[ST.i].a;ST.i++;ST.ok=0;ST.ko=0;if(ST.i>=ST.L.length){stFine();return}}
 else if(ST.ko>=2){stFine();return}
 stTrial()}
function stFine(){var mn=ST.L[ST.L.length-1].a,mx=ST.L[0].a;
 if(ST.pass===null){V.stereo="";V.stereo_nessuno=true;V.stereo_txt="nessun livello superato (oltre "+mx+"″) a "+ST.cal.dist+" cm"}
 else{V.stereo=String(ST.pass);V.stereo_nessuno=false;V.stereo_txt=ST.pass+"″ a "+ST.cal.dist+" cm"+(ST.pass===mn?" (livello più fine misurabile su questo schermo)":"")}
 V.stereo_min=String(mn);sl();stChiudi();draw();msg("Stereopsi: "+V.stereo_txt)}
function stKey(e){var o=document.getElementById("stov");if(!o||o.style.display==="none")return;
 var k={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(k!==undefined&&document.getElementById("stcv")){e.preventDefault();stRisp(k)}
 if(e.key==="Escape")stChiudi()}
function stChiudi(){var o=document.getElementById("stov");if(o){o.style.display="none";o.innerHTML=""}document.removeEventListener("keydown",stKey)}

try{var x=localStorage.getItem(KEY);if(x)V=JSON.parse(x)}catch(e){}
draw();
</script>
