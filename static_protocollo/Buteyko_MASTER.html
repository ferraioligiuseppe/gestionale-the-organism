<script>
var CAT = {"esercizi":[{"id":"naso","nome":"Liberare il naso","intensita":"moderata","dose":"5–6 ripetizioni, quando il naso è chiuso","come":"Seduto o in piedi, inspira ed espira piano dal naso. Dopo l'espirazione tappa il naso con le dita e cammina (o annuisci con la testa, se sei seduto) trattenendo il respiro finché senti una fame d'aria da moderata a forte. Lascia il naso e respira solo dal naso, con calma: in 30–60 secondi il respiro deve tornare tranquillo. Aspetta un minuto e ripeti.","cautela":"Con le precauzioni attive: solo fame d'aria lieve, poche ripetizioni, mai fino al disagio."},{"id":"leggera","nome":"Respirare leggero","intensita":"lieve","dose":"4 minuti + 1 di pausa, 3–4 cicli · 2 volte al giorno","come":"Seduto con la schiena dritta e le spalle rilassate. Respira dal naso e riduci a poco a poco la quantità d'aria, senza trattenere il respiro, finché senti una lieve fame d'aria, tollerabile. Mantienila per 4 minuti, poi riposa un minuto respirando normalmente. Varianti: A · una mano sul petto e una sulla pancia, per sentire il respiro scendere; B · mani a coppa davanti a naso e bocca, per sentire l'aria più calda e umida; C · un dito sotto le narici, per sentire appena il flusso; D · ritmata, contando i tempi di inspirazione ed espirazione.","cautela":""},{"id":"lento","nome":"Respirare lento e basso","intensita":"lieve","dose":"5 minuti · 2–3 volte al giorno e quando sale l'agitazione","come":"Respira dal naso, portando l'aria verso la pancia e non verso il petto. Rallenta fino a circa 6 respiri al minuto: inspira in 4 secondi, espira in 6, senza forzare la quantità d'aria. Se arriva un sospiro, lascialo passare senza prendere un respiro grande.","cautela":""},{"id":"cammina","nome":"Camminare con la bocca chiusa","intensita":"lieve","dose":"Ogni camminata, 10–20 minuti al giorno","come":"Cammina respirando solo dal naso. Se senti di dover aprire la bocca, rallenta il passo finché il naso basta. Poco a poco si potrà camminare più veloce con la bocca chiusa.","cautela":""},{"id":"passi10","nome":"Apnee brevi in camminata (fino a 10 passi)","intensita":"lieve","dose":"10 ripetizioni · 1 volta al giorno","come":"Dopo un'espirazione normale tappa il naso e cammina da 2 a 10 passi, poi lascia il naso e respira normalmente per circa 30 secondi. È la versione leggera dell'apnea in camminata: adatta ai bambini e a chi ha una Pausa Controllo bassa.","cautela":""},{"id":"apnea_cam","nome":"Apnea in camminata","intensita":"forte","dose":"6–10 ripetizioni, a 1 minuto di distanza · solo con Pausa Controllo ≥ 20 s","come":"Dopo un'espirazione normale tappa il naso e cammina contando i passi, fino a una fame d'aria da moderata a forte. Lascia il naso, respira dal naso e calma il respiro entro poche respirazioni. Annota i passi: l'obiettivo, nelle settimane, è arrivare a 80–100.","cautela":"Da non fare con le precauzioni attive."},{"id":"corsa","nome":"Fame d'aria in corsa","intensita":"forte","dose":"8–10 ripetizioni durante una corsa leggera · solo con Pausa Controllo ≥ 25 s","come":"Durante una corsa leggera, respirando dal naso: espira normalmente e trattieni il respiro per 10–15 passi, poi riprendi a respirare dal naso per circa un minuto. Simula l'allenamento in quota.","cautela":"Da non fare con le precauzioni attive. Mai in acqua."},{"id":"apnee_brevi","nome":"Molte apnee brevi","intensita":"lieve","dose":"Per qualche minuto, ai primi segni di tosse, sibilo, affanno o agitazione","come":"Espira normalmente, trattieni il respiro per 2–5 secondi, poi respira normalmente per circa 10 secondi. Ripeti finché il sintomo si calma. Serve a fermare l'aumento del respiro che alimenta tosse, sibilo e panico.","cautela":"Nell'asma i farmaci di soccorso restano quelli indicati dal medico."},{"id":"sospiri","nome":"Fermare sospiri e sbadigli","intensita":"lieve","dose":"Ogni volta che arriva un sospiro","come":"Quando senti salire un sospiro o uno sbadiglio, deglutisci oppure trattieni il respiro per qualche secondo, invece di prendere una boccata d'aria. I sospiri frequenti mantengono il respiro eccessivo.","cautela":""},{"id":"sera","nome":"Respiro della sera","intensita":"lieve","dose":"15–20 minuti a letto, ogni sera","come":"A letto, prima di dormire, senza schermi: respirazione leggera e lenta dal naso. Meglio sul fianco che a pancia in su.","cautela":""},{"id":"cerotto","nome":"Bocca chiusa di notte (cerotto)","intensita":"lieve","dose":"Ogni notte, dopo la prova di giorno","come":"Si usa un cerotto di carta specifico per le labbra (per esempio MyoTape), che tiene le labbra unite ma lascia la bocca libera di aprirsi. Prima si prova di giorno per 20 minuti, poi si usa di notte.","cautela":"Non usarlo con il naso chiuso, nausea o vomito, dopo alcol o sedativi. Sotto i 5 anni solo su indicazione del clinico. Con apnee notturne diagnosticate, solo dopo aver sentito il medico del sonno."},{"id":"giochi","nome":"Giochi di respiro (bambini)","intensita":"lieve","dose":"5–10 minuti al giorno, come un gioco","come":"Il respiro del topolino: respirare così piano che un topolino vicino al naso non se ne accorga. La sfida dei passi: quanti passi riesci a fare con il naso tappato, segnando il record su un foglio. Le camminate a bocca chiusa, contando chi resiste di più.","cautela":""}],"profili":[{"id":"bambini","nome":"Bambini 5–16 anni","es":["naso","passi10","giochi","cammina","leggera","cerotto"],"nota":"Spiegare a che cosa serve il naso con parole semplici. Il genitore partecipa agli esercizi. Con adenoidi ingrossate o naso sempre chiuso, valutazione ORL."},{"id":"asma","nome":"Asma e disturbi respiratori","es":["naso","leggera","apnee_brevi","cammina","cerotto"],"nota":"I farmaci restano quelli indicati dal medico: la terapia la modifica solo lui."},{"id":"ansia","nome":"Ansia, panico, stress","es":["lento","leggera","apnee_brevi","sospiri","cammina"],"nota":"Fame d'aria solo lieve: una fame d'aria forte può scatenare l'allarme."},{"id":"sonno","nome":"Sonno: russamento e apnee","es":["leggera","sera","cerotto","naso","cammina"],"nota":"Con apnee notturne diagnosticate il percorso va condiviso con il medico del sonno; la CPAP non si sospende di propria iniziativa."},{"id":"sport","nome":"Sport e prestazione","es":["naso","cammina","apnea_cam","corsa","leggera"],"nota":"Riscaldamento e defaticamento con la bocca chiusa."},{"id":"gravidanza","nome":"Gravidanza","es":["leggera","lento","cammina"],"nota":"Nessuna fame d'aria moderata o forte e nessuna apnea. Da condividere con il ginecologo."}],"precauzioni":["Gravidanza","Ipertensione non controllata","Cardiopatia o aritmia","Epilessia","Diabete di tipo 1","Malattia renale","Attacchi di panico frequenti","Tumore in trattamento","Anemia falciforme","Intervento chirurgico recente","Emicrania severa"]}; var DISP = {"regole":"Le regole del respiro\n\nIl modo in cui respiri durante il giorno conta più degli esercizi. Ecco le regole da seguire sempre.\n\nBocca chiusa, naso aperto\n\n— Respira dal naso, di giorno e di notte. Il naso filtra, scalda e umidifica l'aria.\n— Anche durante l'attività fisica: se devi aprire la bocca, rallenta.\n\nRespiro leggero, lento e basso\n\n— Il respiro a riposo deve essere silenzioso e quasi invisibile.\n— L'aria scende verso la pancia, non solleva il petto e le spalle.\n— Evita i sospiri e i grandi respiri: quando arriva un sospiro, deglutisci.\n\nParlare\n\n— Parla con frasi brevi e prendi aria dal naso tra una frase e l'altra.\n\nLa Pausa Controllo\n\nMisurala ogni mattina appena sveglio: dopo un'espirazione normale tappa il naso e conta i secondi fino al primo desiderio di respirare. Non è una gara: si misura il primo segnale, non quanto resisti. Annota il valore nel diario.","bambini":"Il respiro di tuo figlio\n\nRespirare con la bocca aperta, di giorno o di notte, non è un'abitudine innocua: cambia il sonno, l'attenzione a scuola e la crescita del viso e dei denti.\n\nCosa fare a casa\n\n— Ricordagli con gentilezza di chiudere la bocca, senza rimproveri.\n— Fate insieme gli esercizi, come un gioco, pochi minuti al giorno.\n— Segnate su un foglio i passi fatti con il naso tappato: superare il record è la motivazione migliore.\n— Se il naso è sempre chiuso, ditecelo: può servire una visita dall'otorino.\n\nDi notte\n\n— Osservate se dorme a bocca aperta, russa o fa pause nel respiro.\n— Il cerotto per le labbra si usa solo quando lo indichiamo noi e solo con il naso libero.","asma":"Respiro e asma\n\nNell'asma il respiro tende a diventare più veloce e più grande del necessario, e questo irrita ancora di più i bronchi. Gli esercizi servono a riportarlo a un volume normale.\n\nImportante\n\n— I farmaci restano quelli prescritti: solo il medico può cambiarli.\n— Tieni sempre con te il farmaco di soccorso.\n\nAi primi segni di tosse o sibilo\n\n— Siediti, bocca chiusa, spalle rilassate.\n— Fai le apnee brevi: espira, trattieni 2–5 secondi, respira normalmente 10 secondi. Ripeti per qualche minuto.\n— Se dopo 10 minuti i sintomi non passano, usa il farmaco come indicato dal medico.\n\nOgni giorno\n\n— Respira sempre dal naso, anche quando cammini.\n— Annota la Pausa Controllo: quando sale, di solito i sintomi diminuiscono.","ansia":"Respiro, ansia e stress\n\nQuando siamo agitati il respiro diventa veloce e alto nel petto, con molti sospiri. Questo respiro, a sua volta, aumenta la sensazione di allarme. Si può interrompere il circolo partendo dal respiro.\n\nQuando sale l'agitazione\n\n— Chiudi la bocca e respira dal naso.\n— Rallenta: inspira in 4 secondi, espira in 6.\n— Se il respiro accelera, fai qualche apnea breve di 2–3 secondi.\n— Non cercare un respiro profondo: peggiora la sensazione di fame d'aria.\n\nOgni giorno\n\n— Due momenti di respiro lento e leggero, di 5 minuti, anche quando stai bene.\n— Fai caso ai sospiri: quando ne arriva uno, deglutisci.\n— Gli esercizi devono essere piacevoli: se senti disagio, fermati e respira normalmente.","sonno":"Respiro e sonno\n\nRespirare con la bocca di notte rende il sonno più leggero e favorisce russamento e pause del respiro. Al mattino ci si sveglia con la bocca secca e stanchi.\n\nLa sera\n\n— Niente schermi nell'ultima ora prima di dormire.\n— A letto, 15–20 minuti di respiro leggero e lento dal naso.\n— Meglio dormire sul fianco.\n\nDi notte\n\n— Il cerotto per le labbra aiuta a tenere la bocca chiusa: si prova prima di giorno.\n— Non si usa con il naso chiuso, dopo alcol o sedativi.\n— Se ti è stata prescritta la CPAP, non sospenderla: ne parliamo con il medico del sonno.\n\nAl mattino\n\n— Misura la Pausa Controllo appena sveglio e annotala nel diario.","sport":"Respiro e sport\n\nRespirare dal naso durante l'allenamento all'inizio limita, ma in poche settimane migliora la resistenza e il recupero.\n\nCome iniziare\n\n— Riscaldamento e defaticamento sempre con la bocca chiusa.\n— All'inizio riduci l'intensità quanto serve per restare con il naso.\n— Aumenta gradualmente il ritmo mantenendo la bocca chiusa.\n\nGli esercizi con la fame d'aria\n\n— L'apnea in camminata e quella in corsa si fanno solo con una Pausa Controllo di almeno 20–25 secondi.\n— Mai in acqua, mai alla guida, mai da soli in situazioni a rischio.\n\nIl dato da seguire\n\n— La Pausa Controllo del mattino: più sale, più sale la tolleranza allo sforzo.","gravidanza":"Respiro in gravidanza\n\nIn gravidanza il respiro diventa naturalmente un po' più grande. Gli esercizi servono a mantenerlo calmo e nasale, senza alcuno sforzo.\n\nCosa fare\n\n— Respira dal naso, di giorno e di notte.\n— Respiro leggero e lento, senza mai sentire una fame d'aria più che lieve.\n— Camminate quotidiane con la bocca chiusa.\n\nCosa non fare\n\n— Nessuna apnea e nessun esercizio con fame d'aria moderata o forte.\n— Se senti disagio, fermati e respira normalmente.\n\nGli esercizi vanno condivisi con il ginecologo."}; var QS = [{"id":"nij","nome":"Nijmegen (iperventilazione)","per":"adulti","nota":"Quanto spesso ha avuto questi sintomi nelle ultime settimane. Oltre 23 punti su 64 suggerisce una sindr     h+='<div class="card"><h3>Osservazione del respiro</h3><div class="noprint" style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><span class="timer" id="fm">60</span><button class="btn out" id="fmgo" type="button">▶ 60 secondi per contare gli atti</button></div><div class="row">'+
      inp('fr','Frequenza respiratoria (atti al minuto)','num')+inp('polso','Polso (battiti al minuto)','num')+
      inp('alto_seduto','Respiro da seduto','sel',['','basso (addome)','alto (petto)','misto'])+inp('alto_supino','Respiro supino','sel',['','basso (addome)','alto (petto)','misto'])+inp('alto_piedi','Respiro in piedi','sel',['','basso (addome)','alto (petto)','misto'])+
      inp('bocca_riposo','Bocca a riposo','sel',['','chiusa','socchiusa','aperta'])+inp('naso','Naso','sel',['','libero','parzialmente chiuso','chiuso'])+inp('udibile','Respiro udibile a riposo','sel',['','no','sì'])+inp('sospiri','Sospiri o sbadigli durante la seduta','num')+
      '</div>'+inp('val_note','Note','area')+'</div>';
  }
  if(cur==='q'){
    var a=eta();
    h+='<div class="card"><div class="qtabs noprint">'+QS.map(function(q){var s=qScore(q);return '<button data-q="'+q.id+'" class="'+(q.id===qcur?'on':'')+'">'+q.nome+(s?' · '+s.t:'')+'</button>'}).join('')+'</div>';
    var q=QS.filter(function(x){return x.id===qcur})[0]||QS[0];
    if(a!=null && ((q.per==='bambini' && a>=18) || (q.per==='adulti' && a<14))) h+='<div class="warnbox">Questo questionario è pensato per '+(q.per==='bambini'?'bambini e ragazzi':'adulti')+'.</div>';
    h+='<h2>'+q.nome+'</h2><div class="mut">'+q.nota+'</div>';
    if(q.campi) h+='<div class="row">'+q.campi.map(function(c){return inp('q_'+q.id+'_'+c[0],c[1],c[2],c[3])}).join('')+'</div>';
    q.gruppi.forEach(function(gr,gi){
      if(gr.t) h+='<h3>'+gr.t+'</h3>';
      h+='<table>'+gr.items.map(function(it,ii){ return '<tr><td style="width:55%">'+esc(it)+'</td><td>'+inp('q_'+q.id+'_'+gi+'_'+ii,'','sel',[''].concat(gr.opts))+'</td></tr>'; }).join('')+'</table>';
    });
    var s=qScore(q); h+=s?'<div class="cons" style="margin-top:12px"><b>Risultato: '+s.t+'</b> — '+s.txt+'</div>':'<div class="mut" style="margin-top:10px">Il risultato compare quando ci sono le prime risposte.</div>';
    h+='</div>';
  }
  if(cur==='prog'){
    var b2=bolt(), fm=fameMax(), sug=suggeriti();
    h+='<div class="card"><h2>Programma personalizzato</h2><div class="mut">Gli esercizi segnati con ★ sono quelli indicati per gli ambiti scelti nella scheda 1. Dose e durata si possono cambiare per ogni esercizio.</div><div class="row">'+
      (fm?'<label>Fame d\'aria massima<input value="lieve (bloccata dalle precauzioni o dalla Pausa Controllo bassa)" disabled></label>':inp('pr_fame','Fame d\'aria massima','sel',['','lieve','moderata','forte']))+
      inp('pr_obiettivo','Obiettivo Pausa Controllo (secondi)','num')+inp('pr_controllo','Controllo tra (settimane)','num')+'</div>'+
      '<div class="noprint"><button class="btn out" id="propone" type="button">★ Seleziona gli esercizi indicati</button></div></div>';
    var ord = CAT.esercizi.slice().sort(function(x,y){return (sug.indexOf(y.id)>=0)-(sug.indexOf(x.id)>=0)});
    h+='<div class="card">'+ord.map(function(e){ var no=permesso(e), on=g('pr_'+e.id);
      return '<div class="es'+(on?' on':'')+'"><div class="t"><input type="checkbox" data-k="pr_'+e.id+'"'+(on?' checked':'')+(no&&!on?' disabled':'')+'> '+(sug.indexOf(e.id)>=0?'★ ':'')+e.nome+' <span class="tag t-'+e.intensita+'">fame d\'aria '+e.intensita+'</span>'+(no?' <span class="mut">· '+no+'</span>':'')+'</div>'+
        '<details style="margin:6px 0"><summary class="mut" style="cursor:pointer">Come si fa · '+e.dose+'</summary><div style="font-size:13px;margin:6px 0">'+e.come+'</div>'+(e.cautela?'<div class="warnbox">'+e.cautela+'</div>':'')+'</details>'+
        (on?'<div class="row">'+inp('pr_'+e.id+'_min','Minuti','num')+inp('pr_'+e.id+'_volte','Volte al giorno','num')+inp('pr_'+e.id+'_note','Nota per il paziente')+'</div>':'')+'</div>'; }).join('')+'</div>';
  }
  if(cur==='disp'){
    var lista=[['regole','Le regole del respiro']].concat(CAT.profili.map(function(p){return [p.id,p.nome]})).concat([['prog','Il programma personale']]);
    if(V.d_regole==null){ V.d_regole=true; profiliSel().forEach(function(p){ V['d_'+p.id]=true; }); V.d_prog=true; }
    h+='<div class="card"><h2>Dispense per il paziente</h2><div class="mut">Scegli cosa consegnare. Si stampano su carta intestata oppure si copiano per mandarle per email o WhatsApp.</div><div class="row">'+lista.map(function(x){return inp('d_'+x[0],x[1],'chk')}).join('')+'</div>'+
      '<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="dstampa" type="button">⎙ Stampa su carta intestata</button><button class="btn out" id="dcopia" type="button">Copia il testo</button></div>'+
      '<pre class="disp" id="dtesto">'+esc(dispTesto())+'</pre></div>';
  }
  if(cur==='esito'){
    if(!g('relazione')) V.relazione=riepilogo();
    h+='<div class="card"><h2>Esito</h2><pre class="disp">'+esc(riepilogo())+'</pre></div><div class="card"><h3>Relazione (modificabile)</h3>'+inp('relazione','','area')+
      '<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn out" id="rrig" type="button">Riscrivi dai dati</button><button class="btn" id="rstampa" type="button">⎙ Stampa su carta intestata</button></div></div>';
  }
  document.getElementById('app').innerHTML=h;
  if(cur==='esito'){ var ta=document.querySelector('[data-k="relazione"]'); if(ta) ta.style.minHeight='260px'; }
  document.getElementById('tabs').innerHTML=SEZ.map(function(s){return '<button data-t="'+s.id+'" class="'+(s.id===cur?'on':'')+'">'+s.n+'</button>'}).join('');
  var n=Object.keys(V).filter(function(k){return k[0]!=='_'&&V[k]!==''&&V[k]!=null&&V[k]!==false}).length;
  document.getElementById('stato').textContent = n? n+' campi compilati' : 'da compilare';
}
function dispTesto(){
  var parti=[]; if(g('d_regole')) parti.push(DISP.regole);
  CAT.profili.forEach(function(p){ if(g('d_'+p.id) && DISP[p.id]) parti.push(DISP[p.id]); });
  if(g('d_prog')){ var pt=programmaTesto(); if(pt) parti.push(pt); }
  return parti.join('\n\n\n');
}
function stampa(t){ if(typeof window.pnevAnteprimaCarta==='function') window.pnevAnteprimaCarta(t); else { var w=window.open('','_blank'); w.document.write('<pre style="white-space:pre-wrap;font:14px Georgia">'+esc(t)+'</pre>'); w.print(); } }
var cr0=null, crI=null, fmI=null;
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-t]'); if(b){ cur=V._tab=b.dataset.t; sl(); vista(); window.scrollTo(0,0); return; }
  var q=e.target.closest('[data-q]'); if(q){ qcur=V._qtab=q.dataset.q; sl(); vista(); return; }
  var id=e.target.id;
  if(id==='crgo'){ cr0=Date.now(); clearInterval(crI); crI=setInterval(function(){ var el=document.getElementById('cr'); if(el) el.textContent=((Date.now()-cr0)/1000).toFixed(1).replace('.',',')+' s'; },100); }
  if(id==='crst' && cr0){ clearInterval(crI); var s=Math.round((Date.now()-cr0)/1000); cr0=null; var d=document.getElementById('crdest').value; V[d]=s; sl(); vista(); }
  if(id==='fmgo'){ var t=60; clearInterval(fmI); fmI=setInterval(function(){ t--; var el=document.getElementById('fm'); if(el){ el.textContent=t; el.style.color=t<=10?'#8a1c1c':''; } if(t<=0){ clearInterval(fmI); try{ new AudioContext().resume(); }catch(_){} } },1000); }
  if(id==='propone'){ suggeriti().forEach(function(i){ var x=es(i); if(x && !permesso(x)) V['pr_'+i]=true; }); sl(); vista(); }
  if(id==='dstampa') stampa(dispTesto());
  if(id==='dcopia'){ var t2=dispTesto(); if(navigator.clipboard) navigator.clipboard.writeText(t2); e.target.textContent='Copiato ✓'; }
  if(id==='rrig'){ V.relazione=riepilogo(); sl(); vista(); }
  if(id==='rstampa') stampa(g('relazione')||riepilogo());
});
document.addEventListener('change',function(e){ var k=e.target.dataset&&e.target.dataset.k; if(!k) return;
  V[k]= e.target.type==='checkbox'? e.target.checked : e.target.value; sl();
  if(/^(p_|pre|pr_|d_|bolt|q_|f2)/.test(k)) vista();
  else { var n=Object.keys(V).filter(function(x){return x[0]!=='_'&&V[x]}).length; document.getElementById('stato').textContent=n+' campi compilati'; } });
window.V = V;
vista();
</script></body></html>
